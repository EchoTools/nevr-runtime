# Categories for GitHub's auto-generated release notes.
# Labels are the ones that exist in the repo (`gh label list`).
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Bug fixes
      labels:
        - bug
    - title: New features and improvements
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
