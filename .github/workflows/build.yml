name: Build

# Builds and runs `just verify` when someone asks for it (workflow_dispatch), and builds the release
# when a release is PUBLISHED (`release: published`; a draft fires nothing until it is published, and
# promoting a pre-release to a full release fires no workflow, so promotion rebuilds nothing). Nothing runs
# on a pull request or a push: the merge gate is the local capped `just verify`, and CI runs by hand with
# `gh workflow run build.yml --ref <branch>`. The toolchain is reinstalled from scratch every run
# (~29 billed minutes), which is why it is not automatic.
#
# A release is a plain semver tag vX.Y.Z plus GitHub's pre-release flag. The version is exactly the tag
# (cmake/set_project_version_from_git.cmake): a CI build exactly on the tag stamps X.Y.Z, any other build
# stamps X.Y.(Z+1)-dev.<N>+<sha>. Every release event goes through one packaging path: the build asserts
# the DLL's identity literal (tools/package_release.py stamp), gates it and assembles the package tree
# (tools/package_release.py tree), passes it through the signing stub, and seals it (seal): the Windows
# zip, SHA256SUMS and RELEASE-NOTES.md, all attested and published with the dist/ zips (the .tar.zst
# archives stay a workflow artifact). No file or text
# depends on the pre-release flag, and no step reads it: the uploads leave the `prerelease` input unset so the
# release keeps whatever the human set. The whole workflow runs on
# ubuntu-latest: no Windows runner, no cloud login. A `workflow_dispatch` started on a vX.Y.Z tag ref runs
# the same path as a dry run and publishes nothing.
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # A release whose draft was already built, signed and filled with the attested assets fires `published`
  # when it is published. That must not rebuild or re-upload anything: the signal is the release's asset
  # NAMES (tools/release_already_built.sh: all five files of this version are there), never the
  # pre-release flag. Every job below hangs off `build`, so when the assets are there the run is green
  # and does nothing. A listing that fails fails the job (a check that cannot run does not decide).
  guard:
    runs-on: ubuntu-latest
    # contents: write is only for LISTING draft releases: GitHub's REST docs ("List releases") say "Only users
    # with push access will receive listings for draft releases", so with contents: read a draft is invisible
    # and the lookup below would read "none". Nothing from the tree runs with this token except the
    # tools/*.sh scripts of the checked-out ref, which only call `gh release view` / `gh api` (reads).
    permissions:
      contents: write
    outputs:
      built: ${{ steps.check.outputs.built }}
      draft: ${{ steps.draft.outputs.draft }}
    steps:
    - uses: actions/checkout@v7

    - name: Does this release already carry its assets
      id: check
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        built=false
        if [ "$EVENT" = release ]; then
          built=$(tools/release_already_built.sh "$TAG" "$GITHUB_REPOSITORY")
        fi
        echo "built=$built" >> "$GITHUB_OUTPUT"
        if [ "$built" = true ]; then
          echo "release $TAG already carries its attested assets: nothing is rebuilt and nothing is re-uploaded"
        fi

    # A workflow_dispatch started on the tag ref of a DRAFT release builds the release's five files, attests
    # them and attaches them to that draft (GitHub: `release` created/edited/deleted are not triggered for
    # draft releases, and a draft fires no `published` until it is published, so a draft is reached by
    # dispatching on the tag). draft=true only when the tag has exactly one draft and no published release and
    # the draft carries none of the build's files; a second dispatch on a draft that already carries them
    # fails red here and uploads nothing. No release at all, or a published one, is the usual dry run.
    - name: Find the draft release of this tag
      id: draft
      if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        kind=$(tools/release_draft.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")
        if [ "$kind" = draft ]; then echo "draft=true" >> "$GITHUB_OUTPUT"; else echo "draft=false" >> "$GITHUB_OUTPUT"; fi
        echo "draft release of $GITHUB_REF_NAME: $kind"

  build:
    needs: guard
    if: needs.guard.outputs.built != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      draft: ${{ needs.guard.outputs.draft }}
    # The toolchain is the prebuilt builder image (.github/builder/Dockerfile, built by
    # builder-image.yml): Arch's MinGW-w64 GCC and headers from pacman, the toolchain development
    # uses (#81), not Ubuntu's (ubuntu-24.04 ships GCC 13.2 / mingw-w64 11 with the win32 thread
    # model), plus osslsigncode, buf and the libCrypt32.a link. The tag is the Dockerfile's hash; the
    # "Toolchain versions" step records what built each run.
    container:
      image: ghcr.io/echotools/nevr-runtime-builder:42010dd4ba8e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # just verify runs the C++ tests under Wine. The container runs as root but HOME (/github/home)
      # belongs to the runner user, and Wine refuses a prefix there ("'/github/home' is not owned by
      # you", run 37149598909); give it a root-owned prefix, and skip the Mono/Gecko install prompts.
      WINEPREFIX: /root/.wine-ci
      WINEDLLOVERRIDES: "mscoree,mshtml="
      WINEDEBUG: "-all"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # The build embeds config/public-defaults.env and reads nothing else; it is git-ignored, so it is
    # written here from the repository's Actions variables (and fails when one is unset).
    - name: Write the public client defaults
      uses: ./.github/actions/write-public-defaults
      with:
        socket-uri: ${{ vars.NEVR_SOCKET_URI }}
        http-uri: ${{ vars.NEVR_HTTP_URI }}
        public-api-key: ${{ vars.NEVR_PUBLIC_API_KEY }}
        public-socket-key: ${{ vars.NEVR_PUBLIC_SOCKET_KEY }}

    # The release version: exactly X.Y.Z of the tag vX.Y.Z. A release event takes it from the release's tag
    # name (github.event.release.tag_name); a dispatch started on a tag ref takes it from the ref (a dry
    # run). A tag that is not vX.Y.Z fails the job here with one line: nothing else is built from it.
    # cmake reads the same GITHUB_* variables (set_project_version_from_git.cmake), and the assert step
    # after the build checks that the stamp equals this version, so the two cannot disagree.
    - name: Release version
      id: release
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        re='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
        echo "ref: type=${GITHUB_REF_TYPE:-} name=${GITHUB_REF_NAME:-} event=${EVENT}"
        version=""
        if [ "$EVENT" = release ]; then
          [[ "$TAG" =~ $re ]] || { echo "release tag '$TAG' is not vX.Y.Z: a release is a plain semver tag" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" != tag ] || [ "${GITHUB_REF_NAME:-}" != "$TAG" ]; then
            echo "release tag $TAG but the ref is ${GITHUB_REF_TYPE:-?} ${GITHUB_REF_NAME:-?}" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
        elif [ "${GITHUB_REF_TYPE:-}" = tag ]; then
          [[ "${GITHUB_REF_NAME:-}" =~ $re ]] || { echo "tag '${GITHUB_REF_NAME:-}' is not vX.Y.Z: a release is a plain semver tag" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release version: '${version}' (empty: a branch build, which stamps a development version)"

    - name: Setup pinned just
      uses: extractions/setup-just@v4
      with:
        just-version: '1.58.0'

    - name: Toolchain versions
      run: |
        set -euo pipefail
        pacman -Q mingw-w64-gcc mingw-w64-binutils mingw-w64-headers mingw-w64-crt mingw-w64-winpthreads cmake ninja wine go python
        x86_64-w64-mingw32-g++ --version
        x86_64-w64-mingw32-g++ -v 2>&1 | grep "Thread model"
        cmake --version
        just --version
        osslsigncode --version
        buf --version

    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        # The vcpkg revision is the one in .vcpkg-commit, the same one `just vcpkg-pin-check` holds a
        # local ~/.vcpkg to, so CI builds the dependency versions that are tested locally.
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        # The compiler version plus a hash of every MinGW package vcpkg's compiler hash can see, so a
        # toolchain that moved under the same gcc version (binutils, headers, crt) is a new key and not
        # an exact hit whose archives silently never match.
        echo "gcc=$(pacman -Q mingw-w64-gcc | tr ' ' '-')-$(pacman -Q mingw-w64-gcc mingw-w64-binutils mingw-w64-headers mingw-w64-crt mingw-w64-winpthreads | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    # Building the dependencies from source is about 80% of a run (29.6 of 37.8 minutes in run
    # 37872101662). vcpkg's file binary cache stores one archive per package, named by an ABI hash that
    # covers the port files, its dependencies, the triplet and the compiler, so a changed or bumped
    # dependency is rebuilt even when the cache is restored. The cache key and its restore keys both
    # contain the hash of vcpkg.json: editing vcpkg.json misses the cache entirely and builds everything.
    # Changing the vcpkg revision or the MinGW compiler starts a new entry seeded from the latest entry
    # for the same vcpkg.json.
    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}
        restore-keys: |
          vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-
          vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-

    - name: Install vcpkg dependencies
      run: |
        set -euo pipefail
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: in a container job the second is the host's
        # path, which does not exist here, and vcpkg would write its archives where nothing saves them.
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        echo "archives restored from the cache entry: $(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)"
        "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static --host-triplet=x64-linux \
          --x-manifest-root="$GITHUB_WORKSPACE" \
          --x-install-root="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed"
        count=$(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)
        echo "archives in the binary cache now: $count"
        test "$count" -gt 0

    # Saved right after the install, so a failure in a later step does not lose the dependency build.
    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}

    - name: Generate pinned protobuf sources
      run: |
        set -euo pipefail
        protoc="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed/x64-linux/tools/protobuf/protoc"
        test -x "$protoc"
        just proto

    - name: Configure CMake
      # Never signs here, and nothing in this workflow signs yet: the `sign` job is a stub that passes the files
      # through unsigned (the policy signer is not built).
      # The private-CA path (NEVR_CODESIGN_REQUIRED, `just sign`) is for local development builds only.
      run: cmake --preset mingw-release -DNEVR_CODESIGN_REQUIRED=OFF

    - name: Build
      run: cmake --build --preset mingw-release

    # What the build actually stamped, logged and checked against the version computed above: the DLL's
    # one identity literal "NEVR-BUILD <version> <commit40>" must carry exactly that version and this
    # commit; with no version (a branch build) it must carry a development version. The tree gate below
    # (package_release.py tree) is the backstop and refuses a package whose DLL is not stamped.
    - name: Assert the stamped version
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: python3 tools/package_release.py stamp --dll build/mingw-release/bin/BugSplat64.dll --version "$VERSION" --commit "$GITHUB_SHA"

    - name: Verify
      run: just verify

    - name: Create distribution packages (unsigned)
      if: github.event_name == 'release' || needs.guard.outputs.draft == 'true'
      run: cmake --build --preset mingw-release --target dist dist-lite

    - name: Verify distribution archives
      if: github.event_name == 'release' || needs.guard.outputs.draft == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/*.zip)
        tars=(dist/*.tar.zst)
        test "${#zips[@]}" -eq 2
        test "${#tars[@]}" -eq 2
        for archive in "${zips[@]}"; do
          test -s "$archive"
          zip_entries=$(cmake -E tar tf "$archive")
          [[ "$zip_entries" == *BugSplat64.dll* ]]
          [[ "$zip_entries" == *echovr_server.exe* ]]
        done
        for archive in "${tars[@]}"; do
          test -s "$archive"
          tar_entries=$(tar --zstd -tf "$archive")
          [[ "$tar_entries" == *BugSplat64.dll* ]]
          [[ "$tar_entries" == *echovr_server.exe* ]]
        done

    # The release package tree (the Windows zip's contents, no checksums yet) is gated here: the DLL
    # embeds exactly config/public-defaults.env and its identity literal carries this version and commit.
    - name: Gate and assemble the release tree
      if: steps.release.outputs.version != ''
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        python3 tools/package_release.py tree --version "$VERSION" --commit "$GITHUB_SHA" --out release-stage \
          --dll build/mingw-release/bin/BugSplat64.dll \
          --pc-header build/mingw-release/generated/nevr_builtin_defaults.h

    - name: Upload the release tree
      if: steps.release.outputs.version != ''
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-release-tree
        path: release-stage/
        if-no-files-found: error
        retention-days: 7

    # The unpacked package trees (dist/<name>/, normal and lite) go to the sign job; the unsigned
    # archives are never published.
    - name: Upload the unsigned packages for signing
      if: github.event_name == 'release' || needs.guard.outputs.draft == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-packages
        path: |
          dist/nevr-runtime-v*/
          !dist/.staging/
        if-no-files-found: error
        retention-days: 7

  # Signing is stubbed: the policy signer (a private repository under the owner) is not built yet. This
  # job takes the build's unsigned files and hands them on UNCHANGED, and says so in its log. It runs on
  # ubuntu-latest and costs no more than a few seconds: no Windows runner, no cloud login, no dispatch.
  # Nothing downstream labels these files signed: the artifact is named packages-unsigned, and the release
  # notes and SIGNING.txt state only what holds before and after a signer has run.
  sign:
    name: "sign: stubbed, policy signer not built yet"
    needs: build
    if: github.event_name == 'release' || needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v8
      if: github.event_name == 'release' || needs.build.outputs.draft == 'true'
      with:
        name: unsigned-packages
        path: packages

    - uses: actions/download-artifact@v8
      if: needs.build.outputs.version != ''
      with:
        name: unsigned-release-tree
        path: packages/release

    # PLACEHOLDER: the signer dispatch goes here. Intended flow, once the signer exists: dispatch the
    # private signer repository with this run's `packages` artifact (the policy engine decides what may
    # be signed), wait for it, download the signed files over `packages/`, and let `seal` seal them.
    # Until then this step does not call anything.
    - name: "sign: stubbed, policy signer not built yet (files pass through UNSIGNED)"
      shell: bash
      run: |
        set -euo pipefail
        echo "::warning::sign is stubbed: the policy signer is not built yet; these files are UNSIGNED"
        find packages -type f \( -name '*.dll' -o -name '*.exe' -o -name '*.ps1' \) | sort | while read -r f; do
          echo "UNSIGNED passthrough: $f"
        done

    - uses: actions/upload-artifact@v7
      with:
        name: packages-unsigned
        path: packages
        if-no-files-found: error
        retention-days: 7

  # Seal the release: the zip with its SHA256SUMS regenerated from the files as they are (checked with
  # sha256sum -c), plus the top-level SHA256SUMS and RELEASE-NOTES.md. A release carries no Quest APK. The
  # texts state facts that hold before and after a signer has run, and nothing here reads the pre-release
  # flag: sealing the same tree twice gives the same bytes. A dry run (a dispatch on a tag) ends here: the
  # sealed files are a workflow artifact.
  seal:
    needs: [build, sign]
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: packages-unsigned
        path: staged

    - name: Seal the release
      shell: bash
      run: |
        set -euo pipefail
        tree=$(ls -d staged/release/nevr-runtime-v*-windows)
        python3 tools/package_release.py seal --tree "$tree" --out release-assets
        (cd release-assets && sha256sum -c SHA256SUMS)
        ls -la release-assets

    - uses: actions/upload-artifact@v7
      with:
        name: release-unsigned
        path: release-assets
        if-no-files-found: error
        retention-days: 7

  # Repack the trees into the same archives the build job made, check them, attest their provenance and
  # publish. Signing is stubbed above: the files are published exactly as built.
  publish:
    needs: [build, sign, seal]
    if: ${{ always() && needs.sign.result == 'success' && needs.seal.result == 'success' && (github.event_name == 'release' || needs.build.outputs.draft == 'true') }}
    runs-on: ubuntu-latest
    # id-token and attestations are for the build-provenance attestation (Sigstore, keyless): artifact
    # attestations are available for public repositories on every plan (GitHub Docs, "GitHub security
    # features"). They are not code signing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v7

    - name: Install archive tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd
        python -m pip install cmake==4.4.4

    - uses: actions/download-artifact@v8
      with:
        name: packages-unsigned
        path: staged

    - name: Repack the packages (UNSIGNED, passed through unchanged)
      shell: bash
      env:
        CODESIGN_SKIP: "1"  # signing is stubbed: the packager must not touch the files
      run: |
        set -euo pipefail
        mkdir -p dist
        for pkg in staged/nevr-runtime-v*/; do
          name=$(basename "$pkg")
          python3 tools/build_distribution.py --package "$pkg" --destination "dist/$name" \
            --tar "dist/$name.tar.zst" --zip "dist/$name.zip"
          cmake -DARCHIVE_TAR="dist/$name.tar.zst" -DARCHIVE_ZIP="dist/$name.zip" \
            -P cmake/VerifyDistribution.cmake
        done
        ls -la dist

    - name: Verify distribution archives
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/*.zip)
        tars=(dist/*.tar.zst)
        test "${#zips[@]}" -eq 2
        test "${#tars[@]}" -eq 2

    # The .tar.zst archives are built and checked but are not release assets: the public set is zips only
    # (what Windows users use, and what a signer can sign). They stay here as a workflow artifact.
    - name: Keep the .tar.zst archives as a workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist-tar-zst
        path: dist/*.tar.zst
        if-no-files-found: error
        retention-days: 7

    - uses: actions/download-artifact@v8
      with:
        name: release-unsigned
        path: release-assets

    - name: Attest build provenance of the release files
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          dist/*.zip
          release-assets/*.zip
          release-assets/SHA256SUMS
          release-assets/RELEASE-NOTES.md

    # The upload never sets the pre-release flag: the `prerelease` input is left unset, and the action
    # then re-sends the release's own current value (softprops/action-gh-release, src/github.ts: `config.input_prerelease !== undefined ? config.input_prerelease : existingRelease.prerelease`),
    # read at upload time, so a human's choice (and a promotion made while this run is going) is kept.
    - name: Upload dist artifacts
      uses: softprops/action-gh-release@v3
      with:
        # The one exception to "the uploads set nothing about the release's state": for a dispatch on a draft
        # the action would PUBLISH the reused draft after uploading unless draft: true (its README: "If the
        # action reuses an existing draft release, set draft: true to keep it draft; if draft is omitted, the
        # action will publish that draft after uploading assets"). false for a release event: unchanged.
        draft: ${{ github.event_name == 'workflow_dispatch' }}
        fail_on_unmatched_files: true
        files: |
          dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The release's sealed zip, its checksums and the notes: the declared public set (all attested above).
    - name: Upload the release files
      uses: softprops/action-gh-release@v3
      with:
        draft: ${{ github.event_name == 'workflow_dispatch' }}
        fail_on_unmatched_files: true
        files: |
          release-assets/*.zip
          release-assets/SHA256SUMS
          release-assets/RELEASE-NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
