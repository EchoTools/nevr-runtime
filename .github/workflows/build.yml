name: Build

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install MinGW toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static \
          curl \
          gtest \
          ixwebsocket \
          nlohmann-json \
          miniupnpc \
          minhook \
          opus \
          protobuf

    - name: Configure CMake
      run: cmake --preset mingw-release

    - name: Build
      run: cmake --build --preset mingw-release

    - name: Verify
      run: just verify

    - name: Get version
      if: github.event_name == 'release'
      id: version
      run: |
        VERSION=$(git describe --tags --always)
        echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION#v}"

    - name: Create distribution packages
      if: github.event_name == 'release'
      run: cmake --build --preset mingw-release --target dist

    - name: Upload dist artifacts
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/mingw-release/dist/*.zip
          build/mingw-release/dist/*.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
