name: Build

# Builds and runs `just verify` when someone asks for it (workflow_dispatch), and builds the release
# when a release is PUBLISHED (`release: published`; a draft fires nothing until it is published, and
# promoting a pre-release to a full release fires no workflow, so promotion rebuilds nothing). Nothing runs
# on a pull request or a push: the merge gate is the local capped quick check (AGENTS.md "Builds"), and CI runs by hand with
# `gh workflow run build.yml --ref <branch>`. The toolchain is reinstalled from scratch every run
# (~29 billed minutes), which is why it is not automatic.
#
# A release is a plain semver tag vX.Y.Z plus GitHub's pre-release flag. The version is exactly the tag
# (cmake/set_project_version_from_git.cmake): a CI build exactly on the tag stamps X.Y.Z, any other build
# stamps X.Y.(Z+1)-dev.<N>+<sha>. Every release event goes through one packaging path: the build asserts
# the DLL's identity literal (tools/package_release.py stamp), gates it and assembles the package tree
# (tools/package_release.py tree), and seals it (seal): the Windows
# zip, attested and published with the Quest library (the .tar.zst archives stay a workflow artifact; the
# release body, a player line and one line per file, is written after signing). No file or text
# depends on the pre-release flag, and no step reads it: the uploads leave the `prerelease` input unset so the
# release keeps whatever the human set. The whole workflow runs on
# ubuntu-latest: no Windows runner, no cloud login. The only Windows runners in this repository are in two other,
# hand-started workflows: echocombat-plugins.yml (the EchoCombat plugins, which need MSVC's SEH and Microsoft Detours) and
# defender-scan.yml (a Defender measurement). A `workflow_dispatch` started on a vX.Y.Z tag ref runs
# the same path as a dry run without the Verify step (#1008), and publishes nothing, unless the tag's release is a
# DRAFT carrying none of the built files: then the two files are attached to that draft, which stays a draft (see `drafts`).
on:
  workflow_dispatch:
  release:
    types: [published]

# One group per event and ref: two release runs for one tag (a release published again) queue instead of
# uploading at once, and the second finds the assets and skips (the guard job); two dispatches on one ref
# queue the same way. The event is in the group so a dry-run dispatch on the tag cannot take the place of
# a pending release run: a new run cancels the run that is pending in its group, never the one in
# progress. A release run and a dispatch run on the same tag are in different groups and run
# concurrently: this key does not serialize them.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The one job that LISTS the repository's releases to find a tag's draft. GitHub's REST docs ("List
  # releases"): "Only users with push access will receive listings for draft releases", so a read token sees no
  # draft and would read "none". So the write token is minted here, only for a dispatch on a tag, in a job
  # with no checkout (no repository code runs with it, and checkout's persisted credentials do not exist)
  # and one inline read call. The decision is made by tools/release_draft.sh in `guard`, which holds a
  # read-only token. A release event never mints a write token before the build.
  drafts:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.list.outputs.releases }}
    steps:
    - name: List the releases of this tag
      id: list
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
          --jq '[.[] | select(.tag_name == env.TAG) | {draft, assets: [.assets[]?.name]}]' | jq -sc 'add // []')
        echo "releases=$releases" >> "$GITHUB_OUTPUT"
        echo "releases of $TAG: $releases"

  # A release whose draft was already built, signed and filled with the attested assets fires `published`
  # when it is published. That must not rebuild or re-upload anything: the signal is the release's asset
  # NAMES (tools/release_already_built.sh: both files of this version are there), never the
  # pre-release flag. Every job below hangs off `build`, so when the assets are there the run is green
  # and does nothing. A listing that fails fails the job (a check that cannot run does not decide).
  guard:
    needs: drafts
    # `drafts` is skipped for a release event. A failed listing fails the run, and with `guard` skipped
    # `build` stops on `needs.guard.result == 'success'`, and every job below it with it: nothing is built or
    # uploaded.
    if: ${{ always() && needs.drafts.result != 'failure' && needs.drafts.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.check.outputs.built }}
      draft: ${{ steps.draft.outputs.draft }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Does this release already carry its assets
      id: check
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        built=false
        if [ "$EVENT" = release ]; then
          built=$(tools/release_already_built.sh "$TAG" "$GITHUB_REPOSITORY")
        fi
        echo "built=$built" >> "$GITHUB_OUTPUT"
        if [ "$built" = true ]; then
          echo "release $TAG already carries its attested assets: nothing is rebuilt and nothing is re-uploaded"
        fi

    # A workflow_dispatch started on the tag ref of a DRAFT release builds the release's two files, attests
    # them and attaches them to that draft (GitHub: `release` created/edited/deleted are not triggered for
    # draft releases, and a draft fires no `published` until it is published, so a draft is reached by
    # dispatching on the tag). draft=true only when the tag has exactly one draft and no published release and
    # the draft carries none of the build's files; a second dispatch on a draft that already carries them
    # fails red here and uploads nothing. No release at all, or a published one, is the usual dry run.
    - name: Find the draft release of this tag
      id: draft
      if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
      shell: bash
      env:
        RELEASES: ${{ needs.drafts.outputs.releases }}
      run: |
        set -euo pipefail
        kind=$(printf '%s' "$RELEASES" | tools/release_draft.sh "$GITHUB_REF_NAME")
        if [ "$kind" = draft ]; then echo "draft=true" >> "$GITHUB_OUTPUT"; else echo "draft=false" >> "$GITHUB_OUTPUT"; fi
        echo "draft release of $GITHUB_REF_NAME: $kind"

  # The core installer (installer/, ADR 0023) is built in parallel with the DLL build: it needs the builder image's
  # MinGW linker and installer/Cargo.lock, not the DLLs. The build job waits for this job's artifact inside a step
  # (a `needs` edge would start the build job only after this one ends) and then splits the debug info, strips and
  # links the exe once the dist target has named the package.
  installer:
    needs: guard
    timeout-minutes: 20
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.built != 'true' && (github.event_name == 'release' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/echotools/nevr-runtime-builder:256b66be91d7   # the same tag as the build job
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # The builder image holds Arch's MinGW GCC and no Rust, so the installer job installs the toolchain itself (#1309):
    # rustup-init at a pinned version, checked against its SHA-256 before it runs, a pinned toolchain and the Windows
    # target. Cargo and rustup live under the runner's temp directory (HOME in this container belongs to the runner
    # user, not to root, which rustup-init would call a sudo mistake; RUSTUP_INIT_SKIP_SUDO_CHECK says it is not) and
    # reach the steps after this one through GITHUB_ENV. PATH is not edited: a job that installs vcpkg keeps the PATH
    # its binary cache was keyed on (#816, #819), so the installer step calls cargo by its absolute path.
    - name: Install the Rust toolchain for the core installer
      shell: bash
      run: |
        set -euo pipefail
        export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo" RUSTUP_INIT_SKIP_SUDO_CHECK=yes
        curl --proto '=https' --tlsv1.2 -fsSL -o rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
        echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  rustup-init" | sha256sum -c -
        chmod +x rustup-init
        ./rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.99.1 --target x86_64-pc-windows-gnu
        rm rustup-init
        echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"

    # The core installer that install.ps1 runs: built locked from the committed Cargo.lock for Windows with the same
    # mingw the DLLs use. A release build has no DWARF unless asked, and verify_symbols.py requires the symbol file to
    # carry it, hence line tables. It is built and linked once, as install-nevr-runtime.exe (#1492); the old name is a
    # copy made in the packaging step of the build job.
    - name: Build the core installer for Windows
      shell: bash
      env:
        CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      run: |
        set -euo pipefail
        "$CARGO_HOME/bin/cargo" build --locked --release --target x86_64-pc-windows-gnu --manifest-path installer/Cargo.toml --bin install-nevr-runtime --target-dir build/installer
        test -s build/installer/x86_64-pc-windows-gnu/release/install-nevr-runtime.exe

    - name: Upload the unstripped core installer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: core-installer-unstripped
        path: build/installer/x86_64-pc-windows-gnu/release/install-nevr-runtime.exe
        if-no-files-found: error
        retention-days: 1

  build:
    needs: guard
    # An `if:` with no status function gets an implicit success(), and success() is false when ANY ancestor
    # job was skipped, not only the direct `needs`. `drafts` is skipped on a release event, so without
    # `!cancelled()` here the whole chain below is skipped and a release run is green and does nothing
    # (v5.1.0, run 38409770193). Every job below `drafts` therefore names its own status function.
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.built != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # The wait step reads the installer job's conclusion from the jobs API of this run.
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      draft: ${{ needs.guard.outputs.draft }}
    # The toolchain is the prebuilt builder image (.github/builder/Dockerfile, built by
    # builder-image.yml): Arch's MinGW-w64 GCC and headers from pacman, the toolchain development
    # uses (#81), not Ubuntu's (ubuntu-24.04 ships GCC 13.2 / mingw-w64 11 with the win32 thread
    # model), plus osslsigncode, buf and the libCrypt32.a link. The tag is the Dockerfile's hash; the
    # "Toolchain versions" step records what built each run.
    container:
      image: ghcr.io/echotools/nevr-runtime-builder:256b66be91d7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # just verify runs the C++ tests under Wine. The container runs as root but HOME (/github/home)
      # belongs to the runner user, and Wine refuses a prefix there ("'/github/home' is not owned by
      # you", run 37149598909); give it a root-owned prefix, and skip the Mono/Gecko install prompts.
      WINEPREFIX: /root/.wine-ci
      WINEDLLOVERRIDES: "mscoree,mshtml="
      WINEDEBUG: "-all"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # The build embeds config/public-defaults.env and reads nothing else; it is git-ignored, so it is
    # written here from the repository's Actions variables (and fails when one is unset).
    - name: Write the public client defaults
      uses: ./.github/actions/write-public-defaults
      with:
        socket-uri: ${{ vars.NEVR_SOCKET_URI }}
        http-uri: ${{ vars.NEVR_HTTP_URI }}
        public-api-key: ${{ vars.NEVR_PUBLIC_API_KEY }}
        public-socket-key: ${{ vars.NEVR_PUBLIC_SOCKET_KEY }}

    # The release version: exactly X.Y.Z of the tag vX.Y.Z. A release event takes it from the release's tag
    # name (github.event.release.tag_name); a dispatch started on a tag ref takes it from the ref (a dry
    # run). A tag that is not vX.Y.Z fails the job here with one line: nothing else is built from it.
    # cmake reads the same GITHUB_* variables (set_project_version_from_git.cmake), and the assert step
    # after the build checks that the stamp equals this version, so the two cannot disagree.
    - name: Release version
      id: release
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        re='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
        echo "ref: type=${GITHUB_REF_TYPE:-} name=${GITHUB_REF_NAME:-} event=${EVENT}"
        version=""
        if [ "$EVENT" = release ]; then
          [[ "$TAG" =~ $re ]] || { echo "release tag '$TAG' is not vX.Y.Z: a release is a plain semver tag" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" != tag ] || [ "${GITHUB_REF_NAME:-}" != "$TAG" ]; then
            echo "release tag $TAG but the ref is ${GITHUB_REF_TYPE:-?} ${GITHUB_REF_NAME:-?}" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
        elif [ "${GITHUB_REF_TYPE:-}" = tag ]; then
          [[ "${GITHUB_REF_NAME:-}" =~ $re ]] || { echo "tag '${GITHUB_REF_NAME:-}' is not vX.Y.Z: a release is a plain semver tag" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release version: '${version}' (empty: a branch build, which stamps a development version)"

    - name: Toolchain versions
      run: |
        set -euo pipefail
        # The versions the image was built with (.github/builder/Dockerfile pins the same ones; a test keeps the two
        # lists equal). A different version fails the run before anything is built (#695).
        want=$(cat <<'EOF'
        mingw-w64-gcc 16.2.0-2
        mingw-w64-binutils 2.47-1
        mingw-w64-headers 14.0.0-1
        mingw-w64-crt 14.0.0-1
        mingw-w64-winpthreads 14.0.0-1
        cmake 4.4.4-1
        ninja 1.13.2-3
        wine 11.20-1
        go 2:1.27.2-1
        python 3.14.8-1
        EOF
        )
        got=$(printf '%s\n' "$want" | cut -d' ' -f1 | xargs pacman -Q)
        printf '%s\n' "$got"
        test "$(printf '%s\n' "$got" | sort)" = "$(printf '%s\n' "$want" | sort)"
        x86_64-w64-mingw32-g++ --version
        x86_64-w64-mingw32-g++ -v 2>&1 | grep "Thread model"
        cmake --version
        just --version
        # The image's own just is the one the release was built with. An action that installs one adds a
        # directory to PATH, and PATH is part of every mingw package ABI (see the vcpkg install below).
        test "$(just --version)" = "just 1.58.0"
        osslsigncode --version
        buf --version

    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        # The vcpkg revision is the one in .vcpkg-commit, the same one `just vcpkg-pin-check` holds a
        # local ~/.vcpkg to, so CI builds the dependency versions that are tested locally.
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        # The compiler version plus a hash of every MinGW package vcpkg's compiler hash can see, so a
        # toolchain that moved under the same gcc version (binutils, headers, crt) is a new key and not
        # an exact hit whose archives silently never match.
        echo "gcc=$(pacman -Q mingw-w64-gcc | tr ' ' '-')-$(pacman -Q mingw-w64-gcc mingw-w64-binutils mingw-w64-headers mingw-w64-crt mingw-w64-winpthreads | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    # Building the dependencies from source is about 80% of a run (29.6 of 37.8 minutes in run
    # 37872101662). vcpkg's file binary cache stores one archive per package, named by an ABI hash that
    # covers the port files, its dependencies, the triplet and the compiler, so a changed or bumped
    # dependency is rebuilt even when the cache is restored. The cache key and its restore keys both
    # contain the hash of vcpkg.json: editing vcpkg.json misses the cache entirely and builds everything.
    # Changing the vcpkg revision or the MinGW compiler starts a new entry seeded from the latest entry
    # for the same vcpkg.json.
    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin4-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}
        restore-keys: |
          vcpkg-bin4-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-
          vcpkg-bin4-${{ hashFiles('vcpkg.json') }}-

    - name: Install vcpkg dependencies
      run: |
        set -euo pipefail
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: in a container job the second is the host's
        # path, which does not exist here, and vcpkg would write its archives where nothing saves them.
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        echo "archives restored from the cache entry: $(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)"
        # The x64-mingw-static triplet lists PATH in VCPKG_ENV_PASSTHROUGH, so the value of PATH is part of
        # every mingw package ABI hash. A PATH that differs between jobs gives every archive a different name and the restore
        # finds none. The pin is the justfile's (_vcpkg-mingw), which `just verify` installs under: with a different pin
        # verify rebuilt all 14 mingw packages (run 39433944012, 19 of its 33 Verify minutes, #816); test_vcpkg_pin.py compares them.
        # The key does not encode this pin: change the pin and bump the vcpkg-binN prefix in the same commit.
        env PATH=/usr/local/bin:/usr/bin \
          "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static --host-triplet=x64-linux \
          --x-manifest-root="$GITHUB_WORKSPACE" \
          --x-install-root="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed"
        count=$(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)
        echo "archives in the binary cache now: $count"
        test "$count" -gt 0

    # Saved right after the install, so a failure in a later step does not lose the dependency build.
    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin4-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}

    - name: Generate pinned protobuf sources
      run: |
        set -euo pipefail
        protoc="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed/x64-linux/tools/protobuf/protoc"
        test -x "$protoc"
        just proto

    - name: Configure CMake
      # Never signs here, and nothing in this workflow signs: the release signer signs the draft's files
      # afterwards (RELEASING.md).
      # The private-CA path (NEVR_CODESIGN_REQUIRED, `just sign`) is for local development builds only.
      run: cmake --preset mingw-release -DNEVR_CODESIGN_REQUIRED=OFF

    - name: Build
      run: cmake --build --preset mingw-release

    # What the build actually stamped, logged and checked against the version computed above: the DLL's
    # one identity literal "NEVR-BUILD <version> <commit40>" (each of the two DLLs carries it) must carry exactly that version and this
    # commit; with no version (a branch build) it must carry a development version. The tree gate below
    # (package_release.py tree) is the backstop and refuses a package whose DLL is not stamped.
    - name: Assert the stamped version
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        for file in BugSplat64.dll nevr-runtime.dll; do
          python3 tools/package_release.py stamp --dll "build/mingw-release/bin/$file" --version "$VERSION" --commit "$GITHUB_SHA"
        done

    # `just verify` runs test-quest-hooks, which copies the NDK's jni.h ({{ ndk }} in the justfile), so this job needs the
    # NDK the quest job has. Set up here, after the build and before Verify, so the vcpkg binary cache and its
    # ABI hash are untouched (tools/tests/test_build_workflow_ndk.py, #837). Tag builds skip Verify (#1008), the only
    # step that needs the NDK, so they skip this step too.
    - name: Set up the Android NDK
      if: github.ref_type != 'tag'
      uses: ./.github/actions/setup-ndk

    # Tag builds skip Verify (#1008): every commit on main already passed `just verify` on its PR, and the tag's
    # build proves the build and packaging (RELEASING.md). A branch or main dispatch still runs it.
    - name: Verify
      if: github.ref_type != 'tag'
      env:
        # A release or draft build never fetches the real signed plugin fixture from outside GitHub (justfile, test-auth-unit).
        NEVR_RELEASE_BUILD: ${{ steps.release.outputs.version != '' && '1' || '' }}
      run: just verify

    # Built for a dry run on a tag too (a version is set), because the Windows zip is made from this package's
    # stripped DLL.
    - name: Create distribution packages (unsigned)
      if: steps.release.outputs.version != ''
      run: cmake --build --preset mingw-release --target dist

    - name: Verify distribution archives
      if: github.event_name == 'release' || needs.guard.outputs.draft == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/*.zip)
        tars=(dist/*.tar.zst)
        test "${#zips[@]}" -eq 1
        test "${#tars[@]}" -eq 1
        for archive in "${zips[@]}"; do
          test -s "$archive"
          zip_entries=$(cmake -E tar tf "$archive")
          [[ "$zip_entries" == *BugSplat64.dll* ]]
          [[ "$zip_entries" == *nevr-runtime.dll* ]]
          [[ "$zip_entries" == *echovr_server.exe* ]]
        done
        for archive in "${tars[@]}"; do
          test -s "$archive"
          tar_entries=$(tar --zstd -tf "$archive")
          [[ "$tar_entries" == *BugSplat64.dll* ]]
          [[ "$tar_entries" == *nevr-runtime.dll* ]]
          [[ "$tar_entries" == *echovr_server.exe* ]]
        done

    # The core installer is built by the installer job, in parallel with this job. This step waits for that job's
    # conclusion from the jobs API (a job's `conclusion` is set when it completes): `needs` would start this job only
    # after the installer job ends. "absent" is a job the run does not list yet. The deadline is the timeout, and the
    # sleep is the one wait in this step.
    - name: Wait for the core installer job
      if: steps.release.outputs.version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + 900))        # out: 900 s, then fail loudly
        while :; do
          # A poll that fails (an API error, a rate limit, a body without `jobs`) is "unreadable" and tried again until the deadline.
          c=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            | python3 -c 'import json,sys; j=[x for x in json.load(sys.stdin)["jobs"] if x["name"]=="installer"]; print((j[0]["conclusion"] or "running") if j else "absent")') || c=unreadable
          echo "installer job: $c"
          case "$c" in success) break;; running|absent|unreadable) ;; *) echo "installer job ended: $c" >&2; exit 1;; esac
          [ "$SECONDS" -lt "$deadline" ] || { echo "installer job still $c after 900 s" >&2; exit 1; }
          sleep 10
        done

    - name: Download the core installer
      if: steps.release.outputs.version != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: core-installer-unstripped
        path: core-installer

    # The installer's debug info is split into dist/symbols/<package>/install-nevr-runtime.exe.dbg, the exe is stripped and
    # linked to it: the sequence the dist target runs for the DLLs. It runs after the dist target, which recreates
    # dist/symbols, and it rides in the zip as its own file, so the signed manifest's `contents` covers it.
    - name: Split, strip and link the core installer's symbols
      if: steps.release.outputs.version != ''
      shell: bash
      run: |
        set -euo pipefail
        packages=(dist/nevr-runtime-v*/)
        test "${#packages[@]}" -eq 1
        name=$(basename "${packages[0]%/}")
        exe=build/installer/x86_64-pc-windows-gnu/release/install-nevr-runtime.exe
        mkdir -p "$(dirname "$exe")"
        cp core-installer/install-nevr-runtime.exe "$exe"
        x86_64-w64-mingw32-objcopy --only-keep-debug "$exe" "dist/symbols/$name/install-nevr-runtime.exe.dbg"
        x86_64-w64-mingw32-strip --strip-all "$exe"
        x86_64-w64-mingw32-objcopy "--add-gnu-debuglink=dist/symbols/$name/install-nevr-runtime.exe.dbg" "$exe"
        test -s "$exe"

    # Every shipped PE is stripped and linked (.gnu_debuglink: name and CRC32) to the symbol file the dist
    # target split off it, and the stripped DLL still carries its identity literal (version and commit):
    # a crash from the field maps to function names through the .dbg's COFF symbol table (a release build has
    # no -g, so no source lines), which verify_symbols.py requires to be non-empty. PE has no build-id; the
    # debuglink CRC32 is the link.
    - name: Verify the symbol files match the stripped binaries
      if: steps.release.outputs.version != ''
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        packages=(dist/nevr-runtime-v*/)
        test "${#packages[@]}" -eq 1
        pkg=${packages[0]%/}
        name=$(basename "$pkg")
        for file in BugSplat64.dll nevr-runtime.dll echovr_server.exe; do
          python3 tools/verify_symbols.py "$pkg/$file" "dist/symbols/$name/$file.dbg"
        done
        installer=build/installer/x86_64-pc-windows-gnu/release/install-nevr-runtime.exe
        python3 tools/verify_symbols.py "$installer" "dist/symbols/$name/install-nevr-runtime.exe.dbg"
        # The release tree also holds nevr-install.exe, the same bytes as install-nevr-runtime.exe (#1492), so its
        # debuglink names install-nevr-runtime.exe.dbg and the pair check above covers it through the new name; the
        # tree check on the assembled release tree (the step after the gate) refuses a copy with other bytes and asks
        # for no .dbg of its own.
        python3 tools/verify_symbols.py --tree "$pkg" "dist/symbols/$name"
        for file in BugSplat64.dll nevr-runtime.dll; do
          python3 tools/package_release.py stamp --dll "$pkg/$file" --version "$VERSION" --commit "$GITHUB_SHA"
        done

    # The symbol files are a workflow artifact for the maintainers, not a release asset: players never see
    # them. The publish job attests them to this commit.
    - name: Upload the symbol files
      if: steps.release.outputs.version != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: symbols
        path: dist/symbols/
        if-no-files-found: error
        retention-days: 90

    # The release package tree (the Windows zip's contents, no checksums yet) is gated here: the DLL
    # embeds exactly config/public-defaults.env and its identity literal carries this version and commit.
    # The two DLLs are the stripped, debuglinked ones from the dist package (players get stripped builds only);
    # its symbols are the `symbols` artifact above.
    - name: Gate and assemble the release tree
      if: steps.release.outputs.version != ''
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        packages=(dist/nevr-runtime-v*/)
        test "${#packages[@]}" -eq 1
        pkg=${packages[0]%/}
        installer=build/installer/x86_64-pc-windows-gnu/release/install-nevr-runtime.exe
        # The one copy of the build under the name outside callers still use (#1492). No second link step; the signer
        # signs both entries, and the gate below refuses a copy that is not the same bytes.
        cp "$installer" "$(dirname "$installer")/nevr-install.exe"
        python3 tools/package_release.py tree --version "$VERSION" --commit "$GITHUB_SHA" --out release-stage \
          --dll "$pkg/BugSplat64.dll" \
          --runtime-dll "$pkg/nevr-runtime.dll" \
          --server-exe "$pkg/echovr_server.exe" \
          --installer-exe "$installer" \
          --installer-compat-exe "$(dirname "$installer")/nevr-install.exe" \
          --pc-header build/mingw-release/generated/nevr_builtin_defaults.h

    - name: Verify the Windows tree ships only stripped binaries
      if: steps.release.outputs.version != ''
      shell: bash
      run: |
        set -euo pipefail
        packages=(dist/nevr-runtime-v*/)
        name=$(basename "${packages[0]%/}")
        python3 tools/verify_symbols.py --tree release-stage/nevr-runtime-v*-windows "dist/symbols/$name"

    - name: Upload the release tree
      if: steps.release.outputs.version != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: unsigned-release-tree
        path: release-stage/
        if-no-files-found: error
        retention-days: 7

    # The unpacked package trees (dist/<name>/) go to the repack job; the unsigned
    # archives are never published.
    - name: Upload the unsigned packages for the repack job
      if: github.event_name == 'release' || needs.guard.outputs.draft == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: unsigned-packages
        path: |
          dist/nevr-runtime-v*/
          !dist/.staging/
        if-no-files-found: error
        retention-days: 7

  # The Quest library: libovrplatformloader.so built from the same tag with the Android NDK (the same steps as
  # android.yml: `just test-android` is build, the static-initializer gate, the embedded-defaults check and the
  # ELF ground-truth tests). A loose release asset, attested and uploaded by `publish` under a name that carries
  # the tag. It is not Authenticode; the signer declares it as a file in its
  # config/sources.yml (rule 3.3). Built for a dry run on a tag too, so the asset set is the same for both.
  quest:
    needs: guard
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.built != 'true' && (github.event_name == 'release' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Write the public client defaults
      uses: ./.github/actions/write-public-defaults
      with:
        socket-uri: ${{ vars.NEVR_SOCKET_URI }}
        http-uri: ${{ vars.NEVR_HTTP_URI }}
        public-api-key: ${{ vars.NEVR_PUBLIC_API_KEY }}
        public-socket-key: ${{ vars.NEVR_PUBLIC_SOCKET_KEY }}

    # just 1.58.0 from its release tarball, checked against the digest measured when this pin was written.
    # Not an action that edits PATH (that is what build.yml's other job must never do, #551).
    - name: Install pinned just
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/just.tgz" https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
        echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  $RUNNER_TEMP/just.tgz" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$RUNNER_TEMP/just.tgz" -C "$HOME/.local/bin" just
        test "$("$HOME/.local/bin/just" --version)" = "just 1.58.0"

    - name: Set up the Android NDK
      id: ndk
      uses: ./.github/actions/setup-ndk

    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "VCPKG_ROOT=$HOME/.vcpkg" >> "$GITHUB_ENV"

    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-android-${{ hashFiles('src/quest/vcpkg.json', 'src/quest/vcpkg-overlay-ports/**') }}-${{ steps.ndk.outputs.revision }}-${{ steps.vcpkg.outputs.sha }}
        restore-keys: |
          vcpkg-android-${{ hashFiles('src/quest/vcpkg.json', 'src/quest/vcpkg-overlay-ports/**') }}-${{ steps.ndk.outputs.revision }}-

    # The version the library carries is the tag's, through the same GITHUB_REF_* variables the PC build
    # reads (a release event or a dispatch started on the tag ref). The asset name takes it from the ref.
    - name: Build and test the Quest library
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 4
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        "$HOME/.local/bin/just" test-android

    - name: Name and check the release asset
      id: asset
      shell: bash
      env:
        TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "not a vX.Y.Z tag: $TAG" >&2; exit 1; }
        version=${BASH_REMATCH[1]}
        so=build/android-arm64/sentinel/libovrplatformloader.so
        test -s "$so"
        # The library carries this exact version and this commit. It has no identity literal: kVersion, the short
        # kCommit and the full commit of the build record are separate NUL-bounded strings, so each is matched
        # whole. A bare substring passes X.Y.Z-dev.N for X.Y.Z.
        python3 tools/package_release.py quest-library --lib "$so" --version "$version" --commit "$GITHUB_SHA"
        # The name has one source, shared with the published guard and the draft attach.
        source tools/release_asset_names.sh
        out="quest-asset/$(release_quest_asset_name "$version")"
        mkdir -p quest-asset
        cp "$so" "$out"
        ls -l "$out"
        sha256sum "$out"

    - name: Upload the Quest library
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: quest-library
        path: quest-asset/
        if-no-files-found: error
        retention-days: 7

    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-android-${{ hashFiles('src/quest/vcpkg.json', 'src/quest/vcpkg-overlay-ports/**') }}-${{ steps.ndk.outputs.revision }}-${{ steps.vcpkg.outputs.sha }}

  # Seal the release: the zip with its SHA256SUMS regenerated from the files as they are (the unzipped zip is
  # checked with sha256sum -c). The release is that zip and the Quest library: no top-level SHA256SUMS and no
  # RELEASE-NOTES.md (the body is a player line and one line per file, no hash table). A release carries no Quest APK. The
  # texts state facts that hold before and after a signer has run, and nothing here reads the pre-release
  # flag: sealing the same tree twice gives the same bytes. A dry run (a dispatch on a tag with no draft)
  # ends here: the sealed files are a workflow artifact.
  seal:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: unsigned-release-tree
        path: staged/release

    - name: Seal the release
      shell: bash
      run: |
        set -euo pipefail
        tree=$(ls -d staged/release/nevr-runtime-v*-windows)
        python3 tools/package_release.py seal --tree "$tree" --out release-assets
        zips=(release-assets/*.zip)
        test "${#zips[@]}" -eq 1
        check=$(mktemp -d)
        unzip -q "${zips[0]}" -d "$check"
        (cd "$check" && sha256sum -c SHA256SUMS)
        ls -la release-assets

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-unsigned
        path: release-assets
        if-no-files-found: error
        retention-days: 7

  # Repack the trees into the same archives the build job made and check them. This is the only job
  # that installs tools (apt, pip) or runs repository scripts after the build, and it holds a read-only
  # token: the write token and the attestation identity live in `publish`, which runs no repository
  # code and installs nothing. Nothing here signs: the files are repacked exactly as built.
  repack:
    needs: [build, seal]
    if: ${{ !cancelled() && needs.seal.result == 'success' && (github.event_name == 'release' || needs.build.outputs.draft == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install archive tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd
        python -m pip install cmake==4.4.4

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: unsigned-packages
        path: staged

    - name: Repack the packages (UNSIGNED, passed through unchanged)
      shell: bash
      env:
        CODESIGN_SKIP: "1"  # nothing here signs: the packager must not touch the files
      run: |
        set -euo pipefail
        mkdir -p dist
        for pkg in staged/nevr-runtime-v*/; do
          name=$(basename "$pkg")
          python3 tools/build_distribution.py --package "$pkg" --destination "dist/$name" \
            --tar "dist/$name.tar.zst" --zip "dist/$name.zip"
          cmake -DARCHIVE_TAR="dist/$name.tar.zst" -DARCHIVE_ZIP="dist/$name.zip" \
            -P cmake/VerifyDistribution.cmake
        done
        ls -la dist

    - name: Verify distribution archives
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/*.zip)
        tars=(dist/*.tar.zst)
        test "${#zips[@]}" -eq 1
        test "${#tars[@]}" -eq 1

    # The .tar.zst archives and the dist zip are built and checked but are not release assets: the release is
    # the one sealed Windows zip and the Quest library. The archives stay here as a workflow artifact.
    - name: Keep the .tar.zst archives as a workflow artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dist-tar-zst
        path: dist/*.tar.zst
        if-no-files-found: error
        retention-days: 7

  # Attest the provenance of the release files and publish them: the sealed Windows zip and the Quest library. Nothing is built, installed or run from the repository here.
  publish:
    needs: [build, quest, seal, repack]
    if: ${{ !cancelled() && needs.seal.result == 'success' && needs.repack.result == 'success' && needs.quest.result == 'success' && (github.event_name == 'release' || needs.build.outputs.draft == 'true') }}
    runs-on: ubuntu-latest
    # id-token and attestations are for the build-provenance attestation (Sigstore, keyless): artifact
    # attestations are available for public repositories on every plan (GitHub Docs, "GitHub security
    # features"). They are not code signing. The step is actions/attest at v4 with `subject-path`; its permissions are
    # id-token: write, contents: read and attestations: write (GitHub Docs, "Using artifact attestations to establish
    # provenance for builds"); this job also holds contents: write for the upload. Check a file with
    # `gh attestation verify <file> -R EchoTools/nevr-runtime` (RELEASING.md).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: release-unsigned
        path: release-assets

    # The symbol files (a workflow artifact, never a release asset) are attested to this same commit.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: symbols
        path: symbols

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: quest-library
        path: quest-asset

    - name: Attest build provenance of the release files
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          release-assets/*.zip
          quest-asset/*.so
          symbols/*/*.dbg

    # The upload never sets the pre-release flag: the `prerelease` input is left unset, and the action
    # then re-sends the release's own current value (softprops/action-gh-release, src/github.ts: `config.input_prerelease !== undefined ? config.input_prerelease : existingRelease.prerelease`),
    # read at upload time, so a human's choice (and a promotion made while this run is going) is kept.
    # The release's sealed zip and the Quest library: the declared public set (both attested above).
    - name: Upload the release files
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        # The one exception to "the uploads set nothing about the release's state": for a dispatch on a draft
        # the action would PUBLISH the reused draft after uploading unless draft: true (its README: "If the
        # action reuses an existing draft release, set draft: true to keep it draft; if draft is omitted, the
        # action will publish that draft after uploading assets"). false for a release event: unchanged.
        draft: ${{ github.event_name == 'workflow_dispatch' }}
        fail_on_unmatched_files: true
        files: |
          release-assets/*.zip
          quest-asset/*.so
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
