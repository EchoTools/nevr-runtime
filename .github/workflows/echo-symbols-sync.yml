name: echo-symbols sync

# Daily check of Dualgame/echo-symbols against tools/symbols.pin. When its main
# moves past the pin, fetch the echo_vr-pc subset at that exact sha, validate it,
# regenerate src/runtime/log/symcache_data.cpp, run the tool tests and a compile
# check, then open or update one PR. It never merges and never opens a second PR
# for the same branch. What actually runs here: `go test ./...` in tools/symcache
# and `g++ -std=c++17 -fsyntax-only` on the generated table. The full build is the
# reviewer's quick check; build.yml runs only on workflow_dispatch and release,
# and a PR opened with GITHUB_TOKEN starts no workflow runs at all.
#
# Trust boundary: data is fetched by sha from the public raw endpoint, never from
# a branch tip, so the workflow and the pin describe the same bytes. Permissions
# are limited to the two write scopes the PR needs.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: echo-symbols-sync
  cancel-in-progress: false

jobs:
  sync:
    name: pin, validate, regenerate, PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/symcache/go.mod
          cache: false

      - name: Delete merged or closed automation branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state all --limit 200 --json headRefName,state > "$RUNNER_TEMP/prs.json"
          mapfile -t stale < <(cd tools/symcache && go run . pr-cleanup --input "$RUNNER_TEMP/prs.json")
          if [ "${#stale[@]}" -eq 0 ]; then
            echo "no merged or closed automation branches"
            exit 0
          fi
          for branch in "${stale[@]}"; do
            echo "deleting $branch"
            git push origin --delete "$branch"
          done

      - name: Compare the pin with echo-symbols main
        id: pin
        run: |
          set -euo pipefail
          pin=$(cat tools/symbols.pin)
          head=$(git ls-remote https://github.com/Dualgame/echo-symbols.git refs/heads/main | cut -f1)
          if [ -z "$pin" ] || [ -z "$head" ]; then
            echo "could not read a sha (pin='$pin' head='$head')" >&2
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$pin" = "$head" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "echo-symbols is unchanged at $pin"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "echo-symbols moved $pin -> $head"
          fi

      - name: Fetch both corpora at their shas
        if: steps.pin.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Dualgame/echo-symbols
          curl -fsSL "$base/${{ steps.pin.outputs.pin }}/subsets/echo_vr-pc.json" -o "$RUNNER_TEMP/old.json"
          curl -fsSL "$base/${{ steps.pin.outputs.head }}/subsets/echo_vr-pc.json" -o "$RUNNER_TEMP/new.json"

      - name: Validate, regenerate, compile check
        if: steps.pin.outputs.changed == 'true'
        working-directory: tools/symcache
        run: |
          set -euo pipefail
          go test ./...
          go run . validate --input "$RUNNER_TEMP/new.json" \
            --previous "$(sed -n 's/.*kSymCacheCount = \([0-9]*\);/\1/p' ../../src/runtime/log/symcache_data.cpp)"
          go run . regenerate --pin "${{ steps.pin.outputs.head }}" \
            --input "$RUNNER_TEMP/new.json" \
            --out ../../src/runtime/log/symcache_data.cpp \
            --previous-from ../../src/runtime/log/symcache_data.cpp
          go run . diff --old "$RUNNER_TEMP/old.json" --new "$RUNNER_TEMP/new.json" > "$RUNNER_TEMP/diff.md"
          # The generated table is C++ data in the runtime; compile it before proposing it.
          g++ -std=c++17 -fsyntax-only -I../../src ../../src/runtime/log/symcache_data.cpp

      - name: Open or update the PR
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin='${{ steps.pin.outputs.pin }}'
          head='${{ steps.pin.outputs.head }}'
          short=$(printf '%s' "$head" | cut -c1-12)

          # One stable automation branch: a re-run updates the open PR instead of
          # opening a second one. The pin on that branch records the echo-symbols
          # sha the PR currently tracks (the branch commit is a nevr-runtime sha,
          # not comparable to the echo-symbols head).
          branch="automation/echo-symbols-sync"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // 0')
          pr_head=""
          remote_tip=""
          if [ "$pr" != "0" ]; then
            if git fetch -q origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
              remote_tip=$(git rev-parse --verify -q "refs/remotes/origin/$branch" || true)
              pr_head=$(git show "refs/remotes/origin/$branch:tools/symbols.pin" 2>/dev/null | tr -d '[:space:]' || true)
            fi
          fi
          decision=$(cd tools/symcache && go run . pr-decision --pr "$pr" --pr-head "$pr_head" --head "$head")
          action=$(printf '%s\n' "$decision" | sed -n 's/^action=//p')
          note=$(printf '%s\n' "$decision" | sed -n 's/^note=//p')
          if [ "$action" = "skip" ]; then
            echo "$note"
            exit 0
          fi

          printf '%s\n' "$head" > tools/symbols.pin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tools/symbols.pin src/runtime/log/symcache_data.cpp
          git commit -m "chore(symcache): echo-symbols $pin -> $short"

          # A closed PR can leave the branch behind even though no open PR
          # remains; pick up its tip so the lease protects that case too.
          if [ -z "$remote_tip" ] && git fetch -q origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            remote_tip=$(git rev-parse --verify -q "refs/remotes/origin/$branch" || true)
          fi
          git push --force-with-lease="refs/heads/$branch:${remote_tip}" origin "HEAD:refs/heads/$branch"

          {
            echo "Automated sync of [Dualgame/echo-symbols](https://github.com/Dualgame/echo-symbols) from \`$pin\` to \`$head\`."
            echo
            echo "echo-symbols-sha: $head"
            echo
            echo "Data: the \`echo_vr-pc\` subset."
            echo
            cat "$RUNNER_TEMP/diff.md"
            echo
            echo "## What ran on this change"
            echo
            echo "- \`go test ./...\` in \`tools/symcache\`"
            echo "- \`go run . validate\` on the corpus at \`$head\`: keys, strings, every name re-hashed with CSymbol64, count within 20% of \`$pin\`"
            echo "- \`go run . regenerate\`: wrote \`src/runtime/log/symcache_data.cpp\` (the table in this commit)"
            echo "- \`go run . diff\`: produced the lists above"
            echo "- \`g++ -std=c++17 -fsyntax-only -I../../src src/runtime/log/symcache_data.cpp\`"
            echo
            echo "## What did not run"
            echo
            echo "Checks don't auto-run on this PR: a pull request opened with GITHUB_TOKEN starts no workflow runs, so neither \`build.yml\` nor \`pr-read-check.yml\` fires on it. The reviewer runs the quick check:"
            echo
            echo "- \`just build\`"
            echo "- \`cd tools/symcache && go test ./...\`"
            echo
            echo "Branch lifecycle: the next sync run deletes this branch after the PR merges or closes."
            echo
            echo "Read AGENTS.md at $(git merge-base HEAD origin/main)"
          } > "$RUNNER_TEMP/pr.md"

          if [ "$action" = "update" ]; then
            gh pr edit "$pr" --title "chore(symcache): echo-symbols $short" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --base main --head "$branch" \
              --title "chore(symcache): echo-symbols $short" \
              --body-file "$RUNNER_TEMP/pr.md"
          fi
