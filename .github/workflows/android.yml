name: Android

# Builds and tests the Quest (arm64-v8a) target: `just build-android` then `just test-android`
# (the ELF ground-truth tests in tests/quest). It runs when someone asks for it
# (`gh workflow run android.yml --ref <branch>`); nothing triggers it on a pull request or a push.
# Run it for a change to src/quest, tests/quest, or a shared runtime source src/quest compiles
# (see src/quest/CMakeLists.txt).
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        fetch-depth: 0

    # The Quest build embeds config/public-defaults.env and reads nothing else; it is git-ignored, so it
    # is written here from the repository's Actions variables (and fails when one is unset).
    - name: Write the public client defaults
      uses: ./.github/actions/write-public-defaults
      with:
        socket-uri: ${{ vars.NEVR_SOCKET_URI }}
        http-uri: ${{ vars.NEVR_HTTP_URI }}
        public-api-key: ${{ vars.NEVR_PUBLIC_API_KEY }}
        public-socket-key: ${{ vars.NEVR_PUBLIC_SOCKET_KEY }}

    - name: Setup pinned just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: '1.58.0'

    # The runner image carries NDK r26d; if it ever stops, the action downloads it once and caches it.
    - name: Set up the Android NDK
      id: ndk
      uses: ./.github/actions/setup-ndk

    # The same pinned vcpkg revision as build.yml (src/quest has its own, tiny manifest; each package is a feed
    # entry named by its ABI hash, so the dependencies here and in build.yml share the feed without a key).
    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "VCPKG_ROOT=$HOME/.vcpkg" >> "$GITHUB_ENV"

    # vcpkg's binary cache is the EchoTools GitHub Packages NuGet feed, the same one build.yml uses (its build job
    # comment says why). mono runs nuget.exe; ubuntu-latest does not preinstall it.
    - name: Install mono for vcpkg's NuGet client
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y mono-complete

    - name: Add the GitHub Packages NuGet source for the vcpkg binary cache
      env:
        NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        nuget=$("$VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)
        mono "$nuget" sources add -Source "https://nuget.pkg.github.com/EchoTools/index.json" -StorePasswordInClearText -Name GitHubPackages -UserName EchoTools -Password "$NUGET_TOKEN"
        mono "$nuget" setapikey "$NUGET_TOKEN" -Source "https://nuget.pkg.github.com/EchoTools/index.json"

    - name: Build and test (just build-android, just test-android)
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 4
        VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/EchoTools/index.json,readwrite"
      run: |
        set -euo pipefail
        just test-android
