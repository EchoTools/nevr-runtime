name: Android

# Builds and tests the Quest (arm64-v8a) target: `just build-android` then `just test-android`
# (the ELF ground-truth tests in tests/quest). It runs when someone asks for it
# (`gh workflow run android.yml --ref <branch>`); nothing triggers it on a pull request or a push.
# Run it for a change to src/quest, tests/quest, or a shared runtime source src/quest compiles
# (see src/quest/CMakeLists.txt).
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_REVISION: 26.3.11579264   # NDK r26d, the one src/quest/CMakePresets.json names
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        fetch-depth: 0

    # The Quest build embeds config/public-defaults.env and reads nothing else; it is git-ignored, so it
    # is written here from the repository's Actions variables (and fails when one is unset).
    - name: Write the public client defaults
      uses: ./.github/actions/write-public-defaults
      with:
        socket-uri: ${{ vars.NEVR_SOCKET_URI }}
        http-uri: ${{ vars.NEVR_HTTP_URI }}
        public-api-key: ${{ vars.NEVR_PUBLIC_API_KEY }}
        public-socket-key: ${{ vars.NEVR_PUBLIC_SOCKET_KEY }}

    - name: Setup pinned just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: '1.58.0'

    # The runner image carries NDK r26d (26.3.11579264); if it ever stops, download it once and cache it.
    - name: Locate the NDK
      id: ndk
      run: |
        set -euo pipefail
        dir="/usr/local/lib/android/sdk/ndk/$NDK_REVISION"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        if [ -f "$dir/source.properties" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

    - name: Restore the downloaded NDK
      if: steps.ndk.outputs.present != 'true'
      id: ndk_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/android-ndk-r26d
        key: android-ndk-r26d-linux

    - name: Download NDK r26d
      if: steps.ndk.outputs.present != 'true' && steps.ndk_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
        test -d "$RUNNER_TEMP/android-ndk-r26d"

    - name: Select the NDK and check its revision
      run: |
        set -euo pipefail
        if [ "${{ steps.ndk.outputs.present }}" = "true" ]; then ndk="${{ steps.ndk.outputs.dir }}"; else ndk="$RUNNER_TEMP/android-ndk-r26d"; fi
        grep -q "^Pkg.Revision = $NDK_REVISION" "$ndk/source.properties"
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
        cat "$ndk/source.properties"

    # The same pinned vcpkg revision and file binary cache as build.yml (src/quest has its own, tiny
    # manifest; the entry is keyed by its hash and the triplet).
    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "VCPKG_ROOT=$HOME/.vcpkg" >> "$GITHUB_ENV"

    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-android-${{ hashFiles('src/quest/vcpkg.json') }}-${{ env.NDK_REVISION }}-${{ steps.vcpkg.outputs.sha }}
        restore-keys: |
          vcpkg-android-${{ hashFiles('src/quest/vcpkg.json') }}-${{ env.NDK_REVISION }}-

    - name: Build and test (just build-android, just test-android)
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 4
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        just test-android
        echo "archives in the binary cache: $(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)"

    # Saved after a successful build, so a cache is never made from a failed one.
    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-android-${{ hashFiles('src/quest/vcpkg.json') }}-${{ env.NDK_REVISION }}-${{ steps.vcpkg.outputs.sha }}
