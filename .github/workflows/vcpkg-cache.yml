name: vcpkg cache

# Pre-warms the vcpkg binary cache that Build (build.yml) reads: the EchoTools GitHub Packages NuGet feed. Each
# package is one feed entry named by its ABI hash (the port files, the dependencies, the triplet and the compiler),
# so an install whose entries are missing uploads them and an install whose entries exist downloads them. Feed
# entries are not scoped to a ref, so a push to main that changes an input of the hash fills the feed for every
# branch, tag and release run. Run it by hand too when the mingw compiler version moves without a push
# (`gh workflow run vcpkg-cache.yml --ref main`). The install command and the PATH pin are the same as in
# build.yml; change them together.
on:
  push:
    branches: [main]
    paths:
    - vcpkg.json
    - vcpkg-configuration.json
    - .vcpkg-commit
    - .github/builder/**
    - .github/workflows/vcpkg-cache.yml
  workflow_dispatch:

concurrency:
  group: vcpkg-cache-${{ github.ref }}
  # Queue, never cancel: the upload happens during a ~39 minute install, so a cancelled run uploads what it built only up to the cancel.
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The same builder image as build.yml (.github/builder/Dockerfile): the compiler hash vcpkg puts in
    # every archive name has to come from the same toolchain the build installs from.
    container:
      image: ghcr.io/echotools/nevr-runtime-builder:256b66be91d7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Bootstrap vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        # The vcpkg revision is the one in .vcpkg-commit, the same one `just vcpkg-pin-check` holds a
        # local ~/.vcpkg to, so CI builds the dependency versions that are tested locally.
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    # vcpkg runs nuget.exe through mono on Linux. The builder image has no mono, so the job installs it from the
    # image's pinned archive snapshot (the mirror list in .github/builder/Dockerfile).
    - name: Install mono for vcpkg's NuGet client
      run: pacman -S --noconfirm --needed mono

    # vcpkg's binary cache is the EchoTools GitHub Packages NuGet feed (vcpkg's "binary caching with GitHub Packages"
    # tutorial, https://learn.microsoft.com/en-us/vcpkg/consume/binary-caching-github-packages), written with the
    # built-in token: packages: write above is what lets it upload.
    - name: Add the GitHub Packages NuGet source for the vcpkg binary cache
      env:
        NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        nuget=$("$HOME/.vcpkg/vcpkg" fetch nuget | tail -n 1)
        mono "$nuget" sources add -Source "https://nuget.pkg.github.com/EchoTools/index.json" -StorePasswordInClearText -Name GitHubPackages -UserName EchoTools -Password "$NUGET_TOKEN"
        mono "$nuget" setapikey "$NUGET_TOKEN" -Source "https://nuget.pkg.github.com/EchoTools/index.json"

    - name: Install vcpkg dependencies (uploads the entries the feed lacks)
      env:
        VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/EchoTools/index.json,readwrite"
      run: |
        set -euo pipefail
        # The x64-mingw-static triplet lists PATH in VCPKG_ENV_PASSTHROUGH, so the value of PATH is part of
        # every mingw package ABI hash. A PATH that differs between jobs gives every package a different name, and the
        # feed has no entry for it. This value is the justfile's pin (_vcpkg-mingw), the one `just verify` installs under; test_vcpkg_pin.py compares them.
        env PATH=/usr/local/bin:/usr/bin \
          "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static --host-triplet=x64-linux \
          --x-manifest-root="$GITHUB_WORKSPACE" \
          --x-install-root="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed"
