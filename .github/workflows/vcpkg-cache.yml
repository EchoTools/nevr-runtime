name: vcpkg cache

# Seeds the vcpkg binary cache that Build (build.yml) restores. GitHub lets a run restore only caches
# made on its own ref or on its default branch, so a cache saved on main is the one every branch, tag and
# release run can read: a key that exists only on a branch or a tag makes every release run compile the
# dependencies from source (about 39 minutes). A push to main that changes an input of the key re-seeds it,
# so main always holds the key build.yml asks for. Run it by hand too when the mingw compiler version (part
# of the key) moves without a push (`gh workflow run vcpkg-cache.yml --ref main`). The key, the compiler
# probe and the install command are the same as in build.yml; change them together.
on:
  push:
    branches: [main]
    paths:
    - vcpkg.json
    - vcpkg-configuration.json
    - .vcpkg-commit
    - .github/builder/**
    - .github/workflows/vcpkg-cache.yml
  workflow_dispatch:

concurrency:
  group: vcpkg-cache-${{ github.ref }}
  # Queue, never cancel: the save is the last step of a ~39 minute install, so a cancelled run saves nothing.
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The same builder image as build.yml (.github/builder/Dockerfile): the compiler hash vcpkg puts in
    # every archive name has to come from the same toolchain the build restores them in.
    container:
      image: ghcr.io/echotools/nevr-runtime-builder:1c303e5bfe7d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        # The vcpkg revision is the one in .vcpkg-commit, the same one `just vcpkg-pin-check` holds a
        # local ~/.vcpkg to, so CI builds the dependency versions that are tested locally.
        git -C "$HOME/.vcpkg" checkout --detach "$(cat "$GITHUB_WORKSPACE/.vcpkg-commit")"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "gcc=$(pacman -Q mingw-w64-gcc | tr ' ' '-')-$(pacman -Q mingw-w64-gcc mingw-w64-binutils mingw-w64-headers mingw-w64-crt mingw-w64-winpthreads | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        # No restore-keys: an entry holds only the archives of this key. A fallback to an older entry
        # carried its 19 unusable archives into the saved one (run 37914950616: "Restored 0 package(s)",
        # 38 archives saved, 231 MB grew to 547 MB).
        key: vcpkg-bin3-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}

    - name: Install vcpkg dependencies
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        # The x64-mingw-static triplet lists PATH in VCPKG_ENV_PASSTHROUGH, so the value of PATH is part of
        # every mingw package ABI hash. A PATH that differs between jobs gives every archive a different name and the restore
        # finds none. This value is the builder image's own PATH, which build.yml's job keeps (nothing may add to it).
        # The key does not encode this pin: change the pin and bump the vcpkg-binN prefix in the same commit.
        env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static --host-triplet=x64-linux \
          --x-manifest-root="$GITHUB_WORKSPACE" \
          --x-install-root="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed"
        count=$(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)
        echo "archives in the binary cache now: $count"
        test "$count" -gt 0

    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin3-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}
