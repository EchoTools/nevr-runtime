name: vcpkg cache

# Seeds the vcpkg binary cache that Build (build.yml) restores. GitHub lets a pull request restore only
# caches made on its own ref or on its base branch, so the cache a PR run saves helps that PR alone;
# this workflow saves it on main, where every PR can read it. It runs when vcpkg.json changes on main,
# every day (the key includes the vcpkg revision, which moves), and by hand. The key, the compiler
# probe and the install command are the same as in build.yml; change them together.
on:
  push:
    branches: [main]
    paths:
      - vcpkg.json
      - .github/workflows/vcpkg-cache.yml
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vcpkg-cache.yml

concurrency:
  group: vcpkg-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
    - name: Install the toolchain (pacman)
      run: |
        set -euo pipefail
        pacman -Syu --noconfirm --needed \
          git mingw-w64-gcc ninja cmake python curl zip unzip tar pkgconf zlib

    - uses: actions/checkout@v4

    - name: Bootstrap vcpkg
      id: vcpkg
      run: |
        set -euo pipefail
        git clone https://github.com/Microsoft/vcpkg.git "$HOME/.vcpkg"
        "$HOME/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "sha=$(git -C "$HOME/.vcpkg" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "gcc=$(pacman -Q mingw-w64-gcc | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - name: Restore the vcpkg binary cache
      id: vcpkg_cache
      uses: actions/cache/restore@v4
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}
        restore-keys: |
          vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-
          vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-

    - name: Install vcpkg dependencies
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite"
        "$HOME/.vcpkg/vcpkg" install --triplet=x64-mingw-static --host-triplet=x64-linux \
          --x-manifest-root="$GITHUB_WORKSPACE" \
          --x-install-root="$GITHUB_WORKSPACE/build/mingw-release/vcpkg_installed"
        count=$(find "$GITHUB_WORKSPACE/.vcpkg-binary-cache" -name '*.zip' | wc -l)
        echo "archives in the binary cache now: $count"
        test "$count" -gt 0

    - name: Save the vcpkg binary cache
      if: steps.vcpkg_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-bin2-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.gcc }}-${{ steps.vcpkg.outputs.sha }}
