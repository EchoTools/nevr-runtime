[package]
name = "nevr-install"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The one core install method of nevr-runtime (ADR 0023): verify the signed manifest, install what it names, end in a known state"
publish = false

[lib]
name = "nevr_install"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "nevr-install"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
panic = "unwind"
