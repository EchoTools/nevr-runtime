# nEVR Runtime Configuration
#
# One file, one parser: nEVR's own config reader (src/core/nevr_config.cpp, yaml-cpp). It is not the game's JSON
# config; the game's JSON parser never sees this file.
#
#   PC     the file named by -config-file <file>, else %LOCALAPPDATA%\nevr\echovr\config.yaml (the nEVR root).
#          Nothing else is searched. A -config-file that names no readable file ends the run with exit code 64.
#          A config.yaml in <exe dir>\_local (or one or two folders up) is never read: when the root has none, the
#          first one found is copied there once and the old file is left as it is. Read by
#          src/runtime/lifecycle/service_config.cpp.
#   Quest  /sdcard/Android/data/com.readyatdawn.r15/files/config.yaml. Read by src/quest/sentinel/activation.cpp
#          and src/quest/sentinel/quest_config.cpp. A nevr-quest.json in that directory is not read; the sentinel
#          logs once that it is present and ignored.
#
# Both builds work with no file at all: the service endpoints and the public client keys are embedded at build
# time (config/public-defaults.env), and a key in this file replaces the embedded value. Each key below says which
# builds read it ("both", "PC only", "Quest only"), its default, and the file that reads it.
# KNOWN-WRONG #1254: a PC server with no file and no cached sign-in never logs in and never stops.
#
# The Quest reads exactly these keys: services.socket_uri, auth.http_uri, auth.http_key, auth.server_key,
# social.facade, social.send_presence_to_meta, diagnostics.hardware_dump, diagnostics.ui_event_probe,
# diagnostics.pnsrad_provider, diagnostics.clock_levels_override, graphics.texture_quality, graphics.hand_flip, assets.cdn_url, assets.manifest, assets.required_only, assets.labels, assets.whole_game, network.invite_codes, combat.force, combat.heaps, combat.memsys, the three combat.refresh_rate keys, combat.levelname, combat.sendguard, combat.meshstep, combat.instmodel, combat.shaderstep, combat.tablestep, the combat.gate_* keys, combat.pfx, combat.pfxtev, combat.impactsnd, combat.impactsnd_write, the three combat.decals keys (decals, decals_flip_u, decals_flip_v), the three combat.bvh keys (bvh, bvh_gate, bvh_touch), combat.wallfire, combat.music, combat.sensorwd, combat.ec, combat.ec_words, combat.ecfx, combat.powerboost_stage, combat.dronekill, combat.dronekill_explosion, combat.dronekill_hold, combat.dronemuzzle, combat.gunconnect, combat.aibots, combat.aibots_scenario, combat.weapon_arm, combat.bullet_velocity_guard, combat.sound_symbol_guard, combat.texel_buffer_guard, the two combat.texture_quest2 keys, combat.frozen_frame_exit, combat.frozen_frame_exit_s, combat.hudmeter, the two combat.shieldgamma keys and the six crash-guard keys (fxtrail, voipdrop, custctx, droneguard, droneguard_stage1, peerclamp). Every other key below is PC only: the
# Quest accepts it (it is valid YAML under a known section) and reads nothing from it.
#
# A file the parser cannot use as a whole (a YAML error, an unknown top-level key, a top level that is not a
# mapping, a malformed plugins list, a ${VAR:?} that is unset, nesting deeper than 64 levels, or more than 100,000
# nodes once aliases are expanded) is rejected: the PC server exits (N4); the PC client and the Quest log it and
# run on the embedded defaults. The Quest also rejects a file over 64 KiB. Top-level keys are the sections below
# plus x-* extensions.
#
# Config keys are read by the nEVR runtime (`nevr-runtime.dll` on PC, the sentinel `libovrplatformloader.so` on Quest),
# which runs in-process with the game.
#
# Secrets (keys, tokens, passwords) MUST use ${VAR:?error} environment-variable
# substitution in production. The literal form is for local dev only and MUST
# NEVER be committed to version control.
#
# Every value is interpolated: ${VAR} (an unset one is logged
# once at load; its text is kept in plugin args and other values, and a service key that
# uses it counts as unset), ${VAR:?msg} (required: the load fails when it is
# unset), ${VAR:-default} (optional). Write $${ for a literal ${ that is not a
# variable, e.g. in a plugin's args; nothing after it is looked up. $${ is the
# only escape: $$ not followed by { stays $$. A literal $ immediately followed by
# a variable's value is written ${NO_SUCH_VAR:-$}${VAR}.
# ---------------------------------------------------------------------------

# Schema version. Bump when adding new required sections or restructuring
# existing ones. Currently always 1.
# Reader: src/runtime/lifecycle/config.cpp (LoadLocalConfigHook)
version: 1

# ---------------------------------------------------------------------------
# audio — the player's chosen devices (#412). Optional: absent means the default rule.
#
# Reader: src/runtime/lifecycle/service_config.cpp (NevrCfgCaptureDevice), used by
#         src/runtime/patch/mic_provider.cpp (PC, native Windows only; Wine keeps the OS default)
# ---------------------------------------------------------------------------

# KNOWN-WRONG #1305: the parser rejects a top-level audio: key, so this file as shipped is refused.
audio:
  # The microphone to capture from: an endpoint id, or a part of its friendly name (case-insensitive).
  # When it names no active capture endpoint, the default rule runs: LibOVR's headset mic, a headset-named
  # endpoint, then the OS default. Default (absent): that default rule.
  # capture_device: "Headset Microphone"

# ---------------------------------------------------------------------------
# social — platform social-provider compatibility
#
# pnsrad exports no Social object, so the game's friends and parties would be
# disabled. The façade stands in for it (friends from the server's friend list,
# parties over the server's party messages). It is on by default and only ever
# replaces a missing Social object.
#
# Reader: src/runtime/lifecycle/service_map.cpp (SocialFacadeEnabled, PC),
#         src/quest/sentinel/quest_config.cpp (Quest)
# ---------------------------------------------------------------------------

social:
  # Turn the façade off with `false`. Both builds.
  # Default (absent): true. On the Quest it also needs login: with no usable socket URI and server key the
  # façade is off whatever this says (the sentinel log names the missing prerequisite). The status names under
  # a friend's entry (the rich-presence destinations) ride with the façade and have no key of their own.
  # facade: false

  # Quest only (the PC reads nothing here). Send the rich presence to Meta's platform service, as the game does.
  # `false` answers it locally (no group_presence request leaves the headset, which fails for this APK's identity
  # anyway); friends' status then comes from the game service. Needs the façade.
  # Default (absent): true.
  # send_presence_to_meta: false

# ---------------------------------------------------------------------------
# diagnostics — build diagnostics
#
# Readers: src/quest/sentinel/quest_config.cpp (Quest: hardware_dump, ui_event_probe) and
# src/runtime/lifecycle/service_map.cpp, FrameStatsMode (PC: frame_stats). The PC reads nothing else from the
# section; the Quest reads nothing from frame_stats.
# ---------------------------------------------------------------------------

diagnostics:
  # PC only. The frame-time probe (src/runtime/frame/frame_stats.h): one `[NEVR.PERF] frame_stats` line every 10 s
  # with the interval between iterations of the game's main loop (frames, median_us, p95_us, max_us, over_1p5x,
  # overruns) and, in a PCVR session, the compositor's dropped-frame counts and the app's CPU and GPU time.
  #   true  the loop-interval ring and the line
  #   perf  the line with the compositor stats only (frames=0), to compare the game's own app CPU time with the
  #         ring off against the ring on
  #   false no line
  # The ovr_GetPerfStats copy is installed on every client whatever this says; it keeps what it reads only while
  # this is true or perf. The resolved value is logged at start-up (`[NEVR.PERF] frame_stats start`), off included.
  # tools/perf/pc_frame_summary.py turns one run's lines into summary.json.
  # Default (absent): false.
  # frame_stats: true

  # Quest only. Write the hardware/environment dump (docs/adr/0006-quest-hardware-dump.md) at start-up.
  # Default (absent): false.
  # hardware_dump: true

  # Quest only. The invite/party tab event: the party tab's Invite Members (and the own-id Party button) asks the
  # tablet to switch to its Friends list, where the "+" sends the invite. Needs social.facade.
  # Default (absent): true. Set false to turn the event off.
  # ui_event_probe: false

  # Quest only. Load the game's own libpnsrad as its platform provider instead of libpnsovr, as the PC does
  # (docs/adr/0026-quest-without-pnsovr.md). For development only: nothing sends the login on it yet (#1220), so the
  # game does not log in with it on. Needs the login.
  # Default (absent): false.
  # pnsrad_provider: true

  # Quest only. The clock-level override (#928): the game asks VrApi for CPU and GPU clock level 2/2 once per entry into VR
  # mode, and with this on the sentinel asks for 4/4 instead; any other pair the game asks for is passed through
  # unchanged. The render_config line reports the levels applied (cpu_level, gpu_level) and VrApi's answer
  # (clock_result); the resolved value is logged at start-up even when off. Needs no other feature.
  # Default (absent): false. Set true to turn the override on.
  # clock_levels_override: true

# ---------------------------------------------------------------------------
# graphics — render quality
#
# Reader: src/quest/sentinel/quest_config.cpp (Quest). The PC accepts the section and reads nothing from it.
# ---------------------------------------------------------------------------

graphics:
  # Quest only. The size of the eye buffer the game renders into (per eye). One of: stock, very_low, low, medium, high,
  # very_high, ultra (lower case, exactly). The headset profile (src/quest/headset_profile.h) decides the sizes: the device
  # name picks the row, hollywood a Quest 2 and eureka (not yet measured) a Quest 3, and a headset no rule names gets the
  # Quest 2 sizes. The sizes are the ones the community patch repository's Texture Resolution setting uses for the same
  # names: Quest 3 very_low 1344x1408, low 1680x1760, medium 2376x2568, high 3072x3380, very_high 3584x3944, ultra 4096x4506;
  # Quest 2 very_low 1152x1264, low 1440x1584, medium 1728x1904, high 2016x2224, very_high 2304x2528, ultra 2592x2848; 2
  # samples. This build has not measured any headset's native size. A bigger size looks sharper and costs frame time.
  # `stock` answers the headset's own size; every other level answers the profile's table.
  # The game's settings menu has the same setting: a NEVR page with one control, "Texture Resolution", of the six
  # levels (Very Low to Ultra). A change there applies at the next frame, with no restart, and the game saves it. This key
  # is the level the game starts at when the player has chosen nothing; what the player saved always wins over it. The
  # control shows `stock` as Low.
  # Read once at launch. Any mistake (a value that is not one of the seven words, a mapping or a list, a key with no value,
  # a `graphics` that is not a mapping, an unset ${VAR}, a file rejected as a whole) gives `stock`, with a warning in the
  # sentinel log that names the key. Any other key under `graphics` than `texture_quality` and `hand_flip` (a misspelling such as
  # `texture_qualty`, or `Texture_Quality`) is ignored with a warning that names it.
  # Default (absent): stock. The log line `texture_quality` in the sentinel log names the level, its source and the size.
  # texture_quality: high

  # Quest only. Controller Hand Flip: a boolean. true turns the controllers' orientation by 180 degrees about their local Z axis,
  # for players on a Quest 2 whose Touch Pro or Touch Plus controllers show their hands rolled backwards; false (and absent) leaves
  # every pose as the headset runtime reports it. The settings menu has the same setting, a "Controller Hand Flip" row under
  # Texture Resolution on the NEVR page; a change there takes effect on the next frame, and the sentinel writes it here as `true` (On)
  # or `false` (Off) within about a second, so the next launch starts with the player's last choice. It is the choice at launch
  # only; the menu's choice wins while the game runs. Read once at launch. A value that is not a boolean (a word such as `maybe`, a
  # number, a mapping or a list, a key with no value, an unset ${VAR}) is Off, with a warning in the sentinel log that names the
  # key. The sentinel log line `hand_flip_start` names the value and its source (`config` when this file gave it, `default`
  # when it did not), and `hand_flip_saved` names each write of this key.
  # Default (absent): false.
  # hand_flip: true

# ---------------------------------------------------------------------------
# combat — the combat modules built into the Quest runtime, and EchoCombat built into the PC runtime
#
# Reader: src/quest/sentinel/quest_config.cpp (Quest), gated by src/quest/combat/combat_active.h; on PC, src/runtime/combat/combat.cpp
# reads the EchoCombat keys below (drone ... clean_exit, settings) and nothing else of the section.
# ---------------------------------------------------------------------------

combat:
  # Quest only. A boolean. The combat modules built into the runtime run in the combat APKs (the variant the APK's build
  # names in the first line of the sentinel log, `variant`) and in no other. `true` asks for them to run whatever the APK's variant,
  # which a development build honours and a release build does not: a release build logs one warning that says the key is ignored.
  # A value that is not a boolean (a word such as `maybe`, a number, a mapping or a list, a key with no value, an unset ${VAR}) asks for
  # nothing, with a warning in the sentinel log that names the key. Read once at launch. The sentinel log line `combat_active` names
  # the variant, the build kind, the answer, why, and what became of this key (`force`: not_asked, honoured, redundant or refused).
  # Default (absent): false.
  # force: true
  #
  # sendguard: Quest only. A boolean. A script send to a game space that is not loaded is dropped, not faulted (the game reads a null space
  # and crashes without it; src/quest/combat/sendguard.h). Applies where the combat modules run, as `force` says. `false` leaves the game's own
  # send alone. A value that is not a boolean asks for nothing, with a warning in the sentinel log that names the key. A
  # `sendguard.off` file is not read; one found in `files/q15t` of the app's external files directory is a warning that names this key. Read once at
  # launch; the sentinel log record `combat_config_switch` (module `sendguard`) shows the value and where it came from.
  # Default (absent): true.
  # sendguard: false

  # Quest only. A boolean. The four heap sizes (the game's resource, System, GPU and game-space heaps) are raised before the game allocates them,
  # in the combat APKs (the sizes: 320, 640 (512 on a Quest 2), 512 and 128 MiB). `false` leaves the game's own sizes. A value that is not a
  # boolean is ignored with a warning in the sentinel log that names the key. Read once at launch; the sentinel log line `combat_heaps_install` says
  # what the game reads after the step. Default (absent): true.
  # heaps: false

  # Quest only. A boolean. The render-target layout pool is made with 1024 slots instead of 512 and a log line says whether android_main started after
  # the sizes were set, in the combat APKs. `false` leaves the game's pool and also leaves the System heap size (see `heaps`) as the game
  # has it, because the heap and the pool are one memory change. A value that is not a boolean is ignored with a warning that names the key. Read once at
  # launch; the sentinel log lines `combat_memsys_install` and `combat_memsys_witness` report it. Default (absent): true.
  # memsys: false

  # The refresh-rate rule of the combat modules (src/quest/combat/refresh_rate.h): 90 Hz (72 Hz on a Quest 2) while a combat map is loaded
  # (and, with refresh_rate_lobby, the combat lobby), the game's own rate (120 on a Quest) in an Echo Arena level, in every other lobby and
  # everywhere else. Quest only; it runs where the combat modules run (see `force`). Booleans, read once at launch; a value that is not a
  # boolean keeps the default, with a warning in the sentinel log that names the key. The sentinel log lines `combat_config`,
  # `combat_refresh_rate_install` and `combat_refresh_rate_switch` say what was read and what was sent.
  # refresh_rate: false turns the rule off: the game's own rate always (every request is still logged). Default (absent): true.
  # refresh_rate: false
  # refresh_rate_lobby: true makes the combat lobby (`mpl_lobby_b_combat`) ask for the level rate too; the lobbies arena players use never
  # change. Default (absent): false.
  # refresh_rate_lobby: true
  # refresh_rate_quest2_72: false makes a Quest 2 ask 90 like any other headset instead of 72. Default (absent): true.
  # refresh_rate_quest2_72: false

  # Quest only. A boolean. The game's global level, global_mp, loads at full size in the combat APKs instead of the cut
  # `global_mp_lowspec` a Quest gets (src/quest/combat/levelname.h), together with the booster pool's companion (boosterpool.h): the combat bot body
  # exists only in the full level. The global level loads once after login, before any lobby, so it cannot be limited to combat: an arena match on
  # such an APK runs with the full global level too. `false` leaves the game's cut level, and the bot-body gate (`gate_bots`, below), which needs the full
  # level, then leaves the game's own bot choice, because it asks the game's LoadLevelName slot. A value that is not a boolean is ignored with a warning in the sentinel log that
  # names the key. Read once at launch; the sentinel log lines `combat_levelname_install` and `combat_boosterpool_install` report it, and one `combat_config_switch` record says what was read. Default
  # (absent): true. The plugin's kill file `levelname.off` is not read; one found is a warning that names this key.
  # levelname: false

  # Quest only. A boolean. The wrist HUD's weapon-slot heat fill stops being 0 x 0 (src/quest/combat/hudmeter.h). It acts only while a combat
  # map or the combat lobby is loaded; in an Echo Arena level, in the lobbies arena players use and everywhere else the game's own call
  # goes through untouched. `false` leaves the game's fill. Read once at launch; the sentinel log lines `combat_hudmeter_install` and
  # `combat_scope_change` say what was installed and when a combat level was entered. Default (absent): true.
  # hudmeter: false

  # Quest only. Booleans. The spawn-tube and barrier colours (src/quest/combat/shieldgamma.h). Both act only while a combat map or the combat
  # lobby is loaded; in an Echo Arena level the game's own write goes through untouched. A value that is not a boolean keeps the default,
  # with a warning that names the key. Read once at launch; the sentinel log line `combat_shieldgamma_install` says what was installed.
  # shieldgamma_tube_mirror: false stops the launch-tube windows from showing the team colour. Default (absent): true.
  # shieldgamma_tube_mirror: false
  # shieldgamma_gamma: true decodes the shield and barrier colour as the PC's pixel shader does (red-orange instead of yellow-orange). It was
  # a test switch in the reference build. Default (absent): false.
  # shieldgamma_gamma: true
  # Quest only. Booleans. The resource table-step modules (src/quest/combat/meshstep.h, instmodel.h, shaderstep.h, tablestep.h): the tables of the
  # mesh-list, instanced-model and shader-set resources grow by 1 entry, not the game's 32, while a combat map is loaded, in the combat APKs;
  # in an Echo Arena level, in the lobbies arena players use and before the game is known the resources are the game's own. `false` leaves the game's
  # step of 32 for that resource class even in a combat match. A value that is not a boolean is ignored with a warning in the sentinel log that names
  # the key. Read once at launch; the sentinel log records `combat_config_switch`, `combat_meshstep_install`, `combat_instmodel_install`, `combat_shaderstep_install`
  # and `combat_tablestep_install` report each. Default (absent): true.
  # meshstep: false
  # instmodel: false
  # shaderstep: false
  # tablestep: false

  # The three headset gates of the combat modules (src/quest/combat/headset_gates.h): the game branches on "this is a Quest headset" in three places that
  # a Quest running combat has to skip. Quest only; they run where the combat modules run (see `force`). Booleans, read once at launch; a value that
  # is not a boolean keeps the default, with a warning in the sentinel log that names the key. The sentinel log lines `combat_config`,
  # `combat_gates_install`, `combat_gates_answered`, `combat_gates_scoped_out` and `combat_gates_headset_bind` say what was read and what each gate did.
  # gate_perm: false leaves the game's rule that a party member on a Quest may not use combat. Default (absent): true.
  # gate_perm: false
  # gate_bots: false leaves the game's rule that a Quest gets the arena bot. The gate acts only while a combat map or the combat lobby is loaded, and only
  # where the full-size global_mp is in use (the combat bot exists only there; the gate checks the game's LoadLevelName slot). Default (absent): true.
  # gate_bots: false
  # gate_link: false leaves the combat menus telling the player this is a Quest (which locks the combat cards). Default (absent): true.
  # gate_link: false
  # gate_link_libs: which script libraries the menu gate answers: `all`, `none`, or file names (or fragments of them) separated by commas or spaces,
  # at most 639 characters. A library that is not named gets the game's own answer. Default (absent): the 21 libraries of the combat entries.
  # gate_link_libs: "none"

  # Quest only. A boolean. The particle-renderer gate (src/quest/combat/pfx.h): the switch the particle renderer reads, open in combat maps only and
  # shut in an Echo Arena level, in every lobby and everywhere else. The renderer itself is not in the runtime yet, so `true` changes nothing in the
  # game today; the sentinel log line `combat_pfx_install` says what was read. `false` keeps the gate shut. A value that is not a boolean keeps the
  # default, with a warning in the sentinel log that names the key. Read once at launch. Default (absent): true.
  # pfx: false

  # Quest only. A boolean. The event-effect decision of the particle renderer (src/quest/combat/pfxtev.h): its six event effects may be created in
  # combat maps only. Nothing asks until the renderer is in the runtime, so `true` changes nothing in the game today; the sentinel log line
  # `combat_pfxtev_install` says what was read. `false` refuses the six. A value that is not a boolean keeps the default, with a warning that names the
  # key. Read once at launch. Default (absent): true.
  # pfxtev: false

  # Quest only. Booleans. Three small combat modules that act on the game, each on unless the file says `false` (the reference build has all three on).
  # They run where the combat modules run (see `force`), read once at launch; a value that is not a boolean keeps the default, with a warning in the sentinel
  # log that names the key. The sentinel log lines `combat_gunconnect_install`, `combat_aibots_install` and `combat_weapon_arm_install` say what was read, and
  # each module's acting lines (`combat_gunconnect_connect`, `combat_aibots_enable`, `combat_weapon_arm_set`) say what it did. None of them acts in an Echo
  # Arena level.
  # gunconnect: false leaves the local player's guns as the game has them. Otherwise the game's gun connect is called for them in a combat level when the game
  # left them unconnected (offline practice), so they fire. Default (absent): true.
  # gunconnect: false
  # aibots: false leaves the practice bots standing still, as the game has them. Otherwise the game's AI scenario is started for the bots of a practice match
  # in a combat level. Default (absent): true.
  # aibots: false
  # aibots_scenario: which scenario `aibots` starts: a number 0-6 or one of patrol, randomattack, weaponattack, spike, aithrowtest, aionevone, aibdebugarena;
  # `off` turns the bots off. A word that is none of these keeps RandomAttack, with a warning that does not name it. Default (absent): randomattack.
  # aibots_scenario: randomattack
  # weapon_arm: false leaves the gun hand as the game has it. Otherwise a profile whose `weaponarm` is not 1 (0 or absent) gets the gun in the
  # right hand, the first time it is in a combat map, once per missing marker; a left-handed player's gun moves to the right again after a reinstall, cleared app data
  # or a switch between the store and the combat build. The game saves the hand into the profile, so this changes the saved profile. The profile's marker file stays under `files/q15t` of the app's external files directory. Default
  # (absent): true.
  # weapon_arm: false

  # Quest only. A boolean. The bullet impact sounds (src/quest/combat/impactsnd.h): the game builds its impact table with 5 of 15 rows and a stock id in
  # every row, so a bullet hit plays no impact sound; with this on, a combat level's table gets every row and its Wwise ids. It acts only while a combat
  # level is loaded (an Echo Arena match keeps the game's own table). The sentinel log lines `combat_impactsnd_install` and `combat_impactsnd_scope` say what
  # was read and which loads it acted on. A value that is not a boolean keeps the default, with a warning that names the key. Read once at launch. Default
  # (absent): true.
  # impactsnd: false
  # impactsnd_write: false makes the module read and log the table and write nothing to it (and keeps the game's own loader). Default (absent): true.
  # impactsnd_write: false

  # Quest only. A boolean. The level decals (src/quest/combat/decals.h): the combat levels' static decals, which the Quest renderer cannot draw, as quads in
  # dynamic-mesh nodes from the content pack's `decals.bin`. It draws nothing without that file, and only in a combat level (a combat map or the war room).
  # Without that file it installs nothing and an arena match pays nothing; the sentinel log line `combat_decals_install` says what was read. Default
  # (absent): true.
  # decals: false
  # decals_flip_u and decals_flip_v mirror the decals' uv inside each quad (the uv orientation of the bake is inferred, not read). Default (absent): false.
  # decals_flip_u: true
  # decals_flip_v: true

  # Quest only. Booleans. The static BVH (src/quest/combat/bvh.h): the Quest's level collision tree is a stub, so no cast against the level's walls
  # ever hits. `bvh` answers casts from the game's own static BVH on a combat map or in the combat lobby (walls block the AI's sight and bullets);
  # every other level, an Echo Arena level included, keeps the game's own answers. Default (absent): true.
  # bvh: false leaves the game's stubbed static BVH.
  # bvh_gate: false lets every cast use the tree instead of only the three callers the PC answers from the level. Default (absent): true.
  # bvh_touch: false leaves the touch-interaction ray with the game's own answer instead of a miss. Default (absent): true.
  # wallfire refuses a gun's shot when the segment from the player to the muzzle crosses static geometry on a combat map or in the combat lobby. It needs
  # `bvh: true` and installs nothing without it. Default (absent): true. The sentinel log lines `combat_config_switch`, `combat_bvh_install`,
  # `combat_bvh_summary` and `combat_wallfire_install` say what was read and what was done. A value that is not a boolean keeps the default, with a
  # warning that names the key. Read once at launch.
  # bvh: false
  # bvh_gate: false
  # bvh_touch: false
  # wallfire: false
  # Quest only. Booleans. Combat music (src/quest/combat/music.h): one combat music instance at a time. A music Play posted while a combat map is loaded
  # first posts both music Stops, and the Stops are posted again when the combat map unloads; every other sound, and every Echo Arena level, is the game's own.
  # `false` leaves the game's music alone. Read once at launch; the sentinel log lines `combat_config_switch` and `combat_music_install` say what was read.
  # A value that is not a boolean keeps the default, with a warning that names the key. Default (absent): true.
  # music: false
  # The scanner-sphere watchdog (src/quest/combat/sensorwd.h): in a combat map, a threat-scanner sphere still enabled 6 seconds after its enable is turned off
  # on the game thread, and turned on again at its actor's next ping. An Echo Arena level, every lobby and every other state pass through untouched. `false`
  # leaves the sphere to the game. Read once at launch; the sentinel log lines `combat_config_switch` and `combat_sensorwd_install` say what was read.
  # Default (absent): true.
  # sensorwd: false
  # Quest only. A boolean. The EC network client (src/quest/combat/ec.h): on a combat map or the combat lobby it exchanges the EC network's
  # 16-byte datagrams with the game server (the server needs EC), writes re33_ec_page for the EC script libraries, stores the selected tac mod
  # and, with the `hide` word, hides EC's three tac mods on a server without EC. In every other level, arena included, it passes the game's
  # traffic through and sends nothing. The sentinel log line `combat_ec_install` says what was installed. `false` installs nothing (the page
  # stays zeroed: EC scripts decide as on a PC without the EC network client). A value that is not a boolean keeps the default, with a warning
  # that names the key. Read once at launch. Default (absent): true.
  # ec: false

  # Quest only. A string: the EC client's words, space separated. `types=<letters of VPTO>` names the packet types it carries (veil, point,
  # translocator, overcharge; no word, an empty list or another letter: translocator only); `equip` stores the selected tac mod, `noequip` only
  # logs it; `hide` hides smoke, buff and point on a server without EC; `loctoken=<seconds>` (1 to 600) is a test word that adds a LOC token at
  # that period. The sentinel log line `combat_ec_words` says what was read. Default (absent): "types=VPTO equip hide".
  # ec_words: "types=VPTO equip hide"

  # Quest only. A boolean. NEUTRON effects (src/quest/combat/ecfx.h): the EC wall library queues its NEUTRON effects and the EC client's net
  # tick runs them, on a combat map or the combat lobby only. Needs `ec`. The sentinel log line `combat_ecfx_install` says what was read.
  # `false` leaves the wall library running its effects in its own node. A value that is not a boolean keeps the default, with a warning that
  # names the key. Read once at launch. Default (absent): true.
  # ecfx: false

  # Quest only. An integer 0..3. POWER BOOST, the client half of an EchoCombat server's POWER BOOST (src/quest/combat/powerboost.h): 0 installs
  # nothing; 1 only records the markers the server puts in the heal channel; 2 also keeps them from reaching the game as heals and tells the server
  # a use; 3 also unlinks a target outside the booster's cone. It acts only while a combat map or the combat lobby is loaded. A value that is not
  # an integer in 0..3 keeps the default, with a warning that names the key. The sentinel log line `combat_powerboost_install` says which stage is on.
  # Read once at launch. Default (absent): 3.
  # powerboost_stage: 0

  # Quest only. A boolean. A combat drone's rules (src/quest/combat/dronekill.h): a drone the server says died goes off, a drone that has
  # locked on stays grabbable until it fires, its gun, satellite and port show as one, it chases its target, and its shot's velocity is handed
  # to dronemuzzle. They act only while a combat map is loaded; in every other level the hooks only call the game's function. The sentinel log
  # line `combat_dronekill_install` says what was read. `false` installs nothing. A value that is not a boolean keeps the default, with a
  # warning that names the key. Read once at launch. Default (absent): true.
  # dronekill: false

  # Quest only. A boolean. A combat drone that dies explodes on this client (docs/quest/combat/drone_explosion.md): one the server says died at
  # once, one whose time ran out when its damageable goes off. It needs dronekill (above) and acts only in a combat map. The sentinel log
  # lines `combat_dronekill_explosion` and `combat_dronekill_hold` say what it did. `false` leaves the drone's end to the game. A value that is
  # not a boolean keeps the default, with a warning that names the key. Read once at launch. Default (absent): true.
  # dronekill_explosion: false

  # Quest only. A boolean. A drone whose time ran out keeps the first system its script turns off on until 2.5 s after its explosion: the
  # game's own node for that off is skipped and the module turns the component off later (docs/quest/combat/drone_explosion.md, "The hold").
  # It needs dronekill_explosion (above). Off by default: skipping that node is safe only if turning the component off is all the node does,
  # which is not established yet (a reconstruction of CEnableComponentNode::Enter is pending). A value that is not a boolean keeps the
  # default, with a warning that names the key. Read once at launch. Default (absent): false.
  # dronekill_hold: true

  # Quest only. A boolean. A combat drone's bullets leave its gun, not its root (src/quest/combat/dronemuzzle.h). It needs dronekill (above):
  # with dronekill off it installs nothing and says so (`needs_dronekill_shot`). `false` installs nothing. A value that is not a boolean keeps
  # the default, with a warning that names the key. Read once at launch. Default (absent): true.
  # dronemuzzle: false

  # Quest only. A boolean. A FireBullet call whose velocity is null, at most about 1e-3 m/s or not finite is not made: FireBullet would divide by
  # zero and store a NaN direction (src/quest/combat/bullet_velocity_guard.h). Every other shot reaches the game's function unchanged; it acts
  # in every level. The sentinel log line `combat_bullet_velocity_guard_install` says what was installed, `combat_bullet_velocity_guard_skip`
  # names each skipped shot (the first 10, then a count) and `combat_bullet_velocity_guard_total` counts them at the end. `false` installs
  # nothing. A value that is not a boolean keeps the default, with a warning that names the key. Read once at launch. Default (absent): true.
  # bullet_velocity_guard: false

  # Quest only. A boolean. In a combat map or the combat lobby, a sound post from CSoundCS::PlaySound or from the bullet site whose symbol is 0 or
  # one no stock sound bank defines is not made: the game would fail it in Wwise and write an error record for it (src/quest/combat/sound_symbol_guard.h).
  # Every other post reaches the game's function unchanged, and arena levels are not touched. Off by default: it saves work, it fixes no shown crash.
  # The sentinel log line `combat_sound_symbol_guard_install` says what was installed, `combat_sound_symbol_guard_drop` (Debug) names the first 16
  # drops, and `combat_sound_symbol_guard_total` counts them at the end. A value that is not a boolean keeps the default, with a warning that names
  # the key. Read once at launch. Default (absent): false.
  # sound_symbol_guard: true

  # Quest only. A boolean. A new Vulkan descriptor set's uniform texel buffer bindings hold a zeroed view until the game writes its own, so a
  # binding the game has not written yet reads zeros, not an unmapped address (src/quest/combat/texel_buffer_guard.h). It hooks no game code: the
  # game's lookups of vkCreateDescriptorSetLayout and vkAllocateDescriptorSets get its two wrappers through vk_ext_window; it acts in every level.
  # The sentinel log line `combat_texel_buffer_guard_install` says what was requested, `combat_texel_buffer_guard_zero_view` whether the zeroed view
  # was made and `combat_texel_buffer_guard_end` what was written. `false` requests nothing. A value that is not a boolean keeps the default, with a
  # warning that names the key. Read once at launch. Default (absent): true.
  # texel_buffer_guard: false

  # Quest only. A boolean. On a Quest 2 whose player chose no texture level, the eye buffer is Very Low (1152 x 1264 per eye) in a settled combat
  # map, and the player's level everywhere else (src/quest/combat/texture_quest2.h, docs/quest/combat/texture_quest2.md). "Chose no level" means
  # graphics.texture_quality is absent or `stock`, the player changed nothing in the game's graphics menu, the reference input's start rule named
  # no level, and the development property debug.nevr.texture_level is unset; any of those four keeps the player's level in combat too. With
  # texture_quest2_lobby true the combat lobby counts as a combat map. The change is a live Resize, made only when no level has been loading for
  # 10 s and the game's upload count and lock read 0: a Resize while a level load uploads can hang the game (inferred, not observed). Off by
  # default for that reason (upstream ships it on); the headset row decides. The sentinel log lines `combat_texture_quest2_install`,
  # `texture_quality_level_rule`, `texture_quality_level_held` and `texture_quality_level_rule_off` say what it did. A value that is not a boolean
  # keeps the default, with a warning that names the key. Read once at launch. Default (absent): false.
  # texture_quest2_step_down: true

  # Quest only. A boolean. With texture_quest2_step_down, the combat lobby (mpl_lobby_b_combat, combat-only) is stepped down too, so a lobby -> map
  # -> lobby round trip makes no Resize in its load windows. Default (absent): true.
  # texture_quest2_lobby: false

  # Quest only. A boolean. A combat game whose frames stop for frozen_frame_exit_s seconds while the headset is in VR, in a combat map or the
  # combat lobby, is ended: its activity is finished, and after a 5 s grace the process ends with exit code 1, so the player lands in Home
  # instead of a frozen view (src/quest/combat/frozen_frame_exit.h). It hooks nothing: it reads each frame submit and the game's in-VR word.
  # The sentinel log line `combat_frozen_frame_exit_install` says what was installed, `combat_frozen_frame_exit` and
  # `combat_frozen_frame_exit_end` say it fired and `combat_frozen_frame_exit_counts` counts at the end. `false` installs nothing. A value that
  # is not a boolean keeps the default, with a warning that names the key. Read once at launch. Default (absent): true.
  # frozen_frame_exit: false

  # Quest only. An integer, seconds, 10 to 900: how long the frames may stop before frozen_frame_exit ends the game. A value that is not an
  # integer, or one outside the range, keeps the default, with a warning that names the key. Read once at launch. Default (absent): 30.
  # frozen_frame_exit_s: 30

  # The crash and timing guards of the combat modules (src/quest/combat/fxtrail.h, voipdrop.h, custctx.h, droneguard.h, peerclamp.h). Quest only;
  # each runs where the combat modules run (see `force`), and each is on unless it says `false`. Booleans, read once at launch; a value that is not a
  # boolean keeps the default, with a warning in the sentinel log that names the key. The plugin's `fxtrail.off`, `voipdrop.off` and `custctx.off`
  # files are not read; one found in `files/q15t` of the app's external files directory is a warning that names the key. The sentinel log lines
  # `combat_<module>_install` and `combat_<module>_stats` say what was installed and what each guard caught.
  # fxtrail: a bullet whose trail effect has no instance ends its trail, so the bullet can be freed. Acts only while a combat map is loaded.
  # fxtrail: false
  # voipdrop: a voice packet whose receiver table needs a page that cannot be allocated is dropped instead of crashing the game. Acts in every level.
  # voipdrop: false
  # custctx: three guards on the lobby cosmetics renderer (a destroy of a context that is being loaded, a draw table that cannot grow, a load on
  # a nearly full render-target layout pool). The destroy and draw-table guards act in every level; the pool refusal acts only while a combat map or
  # the combat lobby is loaded.
  # custctx: false
  # droneguard: the drone's follow update is skipped while its target is null instead of crashing the game. Acts in every level.
  # droneguard: false
  # droneguard_stage1: also skips the update when the drone's cached player no longer resolves. Needs droneguard. Default (absent): false.
  # droneguard_stage1: true
  # peerclamp: a peer's last-received stamp above the broadcaster's "now" is pulled down to "now" before the game's timeout loop, so a new game
  # server peer is not dropped as timed out. Acts only while a combat map or the combat lobby is loaded.
  # peerclamp: false

  # PC only: he_is_the_cat's EchoCombat, built into the runtime (src/runtime/combat/combat_settings.h). Booleans, read once at boot; a value
  # that is not a boolean keeps the default and the [NEVR.COMBAT] feature line says `source=unrecognised`. The drone follow crash guard
  # runs whatever these say. Party guns, payload speed, a client's own damage bonus and CombatBots are never on.
  # drone: false            # DRONE. Default: true.
  # overcharge: false       # OVERCHARGE. Default: true.
  # medigun: true           # MEDIGUN (needs overcharge and veil; a client shows it only on a server that states it, #2333). Default: false.
  # veil: false             # UMBRAL VEIL and the combat net. Default: true.
  # match_control: false    # RULES, LOADOUTS, SERIES-10, PAUSE, END MATCH, MAP SWITCH (needs veil). Default: true.
  # balance: false          # Cat's weapon tuning merged into the stock mp_weapon_settings as it loads. Default: true.
  # clean_exit: false       # Ends the process at the engine teardown instead of running it (his quit-crash fix). Default: true.
  # settings:               # Cat's PowerBoost.ini values, <section>.<key>; a key left out takes the value his release ships
  #   buff:
  #     self_damage: 5
  #   cone:
  #     link_window_ms: 500

# ---------------------------------------------------------------------------
# services — URL overrides for game service endpoints
#
# The game hardcodes *.readyatdawn.com URLs that no longer resolve. These keys
# let you redirect each service to nEVR's community infrastructure. Every key
# is optional; when absent the game's hardcoded default is used (and the
# connection will fail unless the WebSocket bridge is active).
#
# Fallback chain (per-key, in GetServiceHostWithFallback):
#   1. Specific service key (e.g. services.config)
#   2. services.login (shared fallback)
#   3. Game hardcoded default
#
# Reader: src/runtime/lifecycle/config.cpp (HttpConnectHook, GetServiceHostWithFallback)
# ---------------------------------------------------------------------------

services:
  # WebSocket endpoint for all game services (login, matchmaking, config, serverdb). Both builds. The runtime
  # rewrites the game's hardcoded wss://*.readyatdawn.com URLs to it; the in-process WebSocket bridge connects to it
  # outbound, and the game's own connections go through the bridge (ws://127.0.0.1:<port>).
  # Default (absent): the value embedded in the build (config/public-defaults.env), on a client and a dedicated
  # server alike (#843). An explicit empty value (`socket_uri: ""`) on a dedicated server takes no default: the
  # server then exits without it unless allow_offline_server is set. The log line `[NEVR.CONFIG] built-in defaults
  # in use` names the keys taken from the build.
  # On the Quest this one key (or auth.http_uri) is what turns the redirect on, and with it the bridge: there is no
  # key for either. Login then needs auth.server_key.
  # Not a secret.
  # Reader: src/runtime/lifecycle/service_map.cpp (flat key nevr_socket_uri), src/quest/sentinel/quest_config.cpp
  # socket_uri: "wss://g.echovrce.com/ws"

  # Dedicated server only: boot without services.socket_uri (no login bridge). Without this a server
  # that has no socket_uri after the built-in default (set socket_uri: "" to take none) exits at start-up,
  # because it could never log in. Set it only for offline boots (test rigs); such a server never logs in or registers.
  # Default (absent): false
  # allow_offline_server: true

  # Login / authentication service. Also serves as the shared fallback for
  # every other service key that is not explicitly set.
  # Default (absent): https://login.readyatdawn.com
  # Not a secret.
  # login: "https://login.echovrce.com"

  # Config / settings service (game config, feature flags, etc.).
  # Fallback: services.login
  # Default (absent): https://config.readyatdawn.com
  # Not a secret.
  # config: "https://config.echovrce.com"

  # General API service (REST endpoints for account, inventory, etc.).
  # Legacy key "api_host" is also checked if apiservice_host is absent.
  # Fallback: services.login
  # Default (absent): https://api.readyatdawn.com
  # Not a secret.
  # api: "https://api.echovrce.com"

  # Transaction / IAP service.
  # Fallback: services.login
  # Default (absent): https://transaction.readyatdawn.com
  # Not a secret.
  # transaction: "https://transaction.echovrce.com"

  # Matchmaking service (lobby creation, server discovery).
  # When the WebSocket bridge is active and no explicit override is set,
  # this service is auto-relayed through the bridge's local proxy.
  # Fallback: services.login
  # Default (absent): wss://matchmaking.readyatdawn.com
  # Not a secret.
  # matchmaking: "wss://matchmaking.echovrce.com"

  # ServerDB / registry service (game server registration and heartbeat).
  # Auto-relayed through the WebSocket bridge when active.
  # Fallback: services.login
  # Default (absent): wss://serverdb.readyatdawn.com
  # Not a secret.
  # serverdb: "wss://serverdb.echovrce.com"

  # Dedicated server only: the ServerDB token route the server registers through, dialed with the server's
  # access token as `Authorization: Bearer` (docs/adr/0001-serverdb-token-auth.md); guilds and regions are added
  # as query parameters. Without it a server (signed in by device code) registers on the token route at
  # socket_uri, so it needs no configuration. A server with none of serverdb, serverdb_uri, or socket_uri
  # stops at registration:
  # `no ServerDB URI: set services.serverdb_uri`.
  # The route taken is logged: `[NEVR.GAMESERVER] serverdb route=<explicit|token|url_params|none> ...`.
  # Default (absent): socket_uri.
  # Not a secret.
  # Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration, flat key nevr_serverdb_uri)
  # serverdb_uri: "ws://g.echovrce.com:80/nevr"

  # Oculus Graph API. Only relevant if the game still queries Oculus services.
  # Legacy key "graphservice_host" is also checked.
  # Default (absent): https://graph.oculus.com
  # Not a secret.
  # graph: "https://graph.oculus.com"

# ---------------------------------------------------------------------------
# network — IP and port configuration for server hosting
#
# Controls how the game server advertises itself to ServerDB and which
# IP addresses it uses for peer-to-peer connections. All keys are optional.
#
# Reader: src/runtime/lifecycle/config.cpp (external_ip, upnp, upnp_port),
#         src/runtime/server/gameserver.cpp (ReadUPnPConfig),
#         src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/server/gameserver_callbacks.cpp (re-registration)
# ---------------------------------------------------------------------------

network:
  # empty_server_ttl_seconds: 0   # 0 (default) = off. Seconds an empty server holds its return to
  #                               # lobby before the process exits; docs/reference/empty-server-ttl.md
  # Internal IP address to advertise for LAN / same-host connections.
  # Use when the auto-detected IP is wrong (multi-homed hosts, Docker, VPNs).
  # Absent: auto-detected from the first non-loopback interface.
  # Not a secret.
  # internal_ip: "192.168.1.100"

  # External / public IP address to advertise to ServerDB.
  # Use when the server is behind NAT and auto-detection picks the wrong IP.
  # Absent: auto-detected via UPnP WAN IP (if UPnP is enabled) or falls back
  # to internal_ip.
  # Not a secret.
  # external_ip: "203.0.113.5"

  # Enable UPnP IGD port mapping for the broadcaster UDP port.
  # When true, the runtime probes for a UPnP IGD and attempts to map the port.
  # CLI flag "-upnp" overrides this value to true.
  # Absent: false (no UPnP).
  # Not a secret.
  # upnp: true

  # External port to request from UPnP. Only used when upnp is enabled.
  # If absent or 0, the internal broadcaster port is used as the external port.
  # Valid range: 1-65535.
  # Absent: 0 (use internal port).
  # Not a secret.
  # upnp_port: 7777

  # A dedicated server's tick rate in Hz: the fixed time step is 1,000,000 / rate microseconds.
  # Valid: 10-1000, or 0 to keep the game's own fixed step (30 a second). A server is always
  # fixed-timestep; 0 does not unpace the loop. Out of range or not a whole number: the default, with
  # a warning in the log. Ignored by a client.
  # Absent: 120.
  # Not a secret.
  # tick_rate_hz: 120

  # AI bots a dedicated server adds to each arena or combat match once it is in game (a social lobby gets none), one a
  # second, through the game's own add-bot request (what the spawn-bot script node uses), so every client sees them.
  # The match's settings get numteams and players_per_team when the service did not send them. A level stops taking
  # bots when its bot bodies run out (a warning says so), and a match never passes the game's 16 entrants. Valid:
  # 0-16. Out of range or not a whole number: 0, with a warning in the log. Ignored by a client.
  # Absent: 0 (no bots).
  # Not a secret.
  # bots_per_session: 0
  # A dedicated server's join hold: how long, in milliseconds, the service's accept of a joining player waits for the
  # session's levels to finish loading and be enabled before it is forwarded to the game (docs/reference/join-hold.md).
  # 0 (the default) is off: no hook is installed and every accept is forwarded at once. Valid: 500-15000; 1-499 is
  # raised to 500 and above 15000 lowered to it, a value that is not a whole number is off, each with a warning in the
  # log. When the time runs out the accepts are forwarded anyway. Ignored by a client. Not a secret.
  # join_hold_ms: 0
  # A dedicated server's match team size: how many players the game's own team assignment puts on one team before
  # it moves the next to the other team or to spectators. A team holds the smaller of this and half its lobby's
  # player limit, in every mode but the AI and social modes (the AI modes keep the game's 3). Valid: 1-8. 1 to 4
  # lowers every match's teams, public matches included; above 5 only a lobby whose limit is 12 or more gets bigger
  # teams (which lobbies the service sends with such a limit is not measured here), and a member past a team's fifth
  # takes a team slot from the start again (a sixth member takes the first slot). Not measured here: EchoRelay reports
  # that an 11th player in a match stops the server in an arena level; keep such a match at 10 players in all (6v4, for
  # example).
  # Out of range or not a whole number: 5, with a warning in the log. Ignored by a client.
  # Absent: 5 (the game's own).
  # Not a secret.
  # max_team_size: 5

  # Which game sockets the PC bridge hands to the session router (the rules the Quest build ships).
  # legacy: the bridge's own rules for every socket. config: the /config sockets route through the router;
  # login and matchmaker sockets keep the bridge's rules. all: every game socket (config, login and matchmaker)
  # routes through the router. Any other value is refused at boot with a fatal error naming the key; the bridge
  # never guesses a mode from a misspelling.
  # Absent: legacy.
  # Not a secret.
  # session_router: legacy

  # The invite codes for the CREATE GAME / JOIN VIA CODE wizard: when on, a code typed into JOIN VIA CODE, and a create,
  # is sent to the game service (auth.http_uri, with the token this client already holds).
  # Absent or empty: on. true/on/yes/1 is on; false/off/no/0 turns it off. Any other value, a list or a map included, leaves
  # it off, with a warning in the log. A key the runtime does not read (a misspelling, or a config.yaml it rejects) is as if
  # absent: on. Ignored by a dedicated server.
  # Absent: on.
  # Not a secret.
  # invite_codes: false

# ---------------------------------------------------------------------------
# identity — server identity fields sent during ServerDB registration
#
# These identify the server instance to the community infrastructure.
# All keys are optional. A server that signs in by device code takes its identity from the
# access token and needs none of them.
#
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/compat/ws_bridge.cpp
# ---------------------------------------------------------------------------

identity:
  # Discord user ID of the server owner. Sent as a query parameter in the
  # ServerDB WebSocket URI on the legacy (URL-parameter) registration route only; a device-code server
  # does not use it.
  # Absent: the server registers through services.serverdb_uri, and with neither it stops at registration.
  # Not a secret, but personally identifying — do not commit to public repos.
  # discord_id: "<the Discord id of the server owner>"

# ---------------------------------------------------------------------------
# auth — authentication and API endpoint configuration
#
# Used for server authentication with Nakama (device-auth flow) and for HTTP
# API calls. The socket URI the in-process WebSocket bridge connects to is
# services.socket_uri, above.
#
# http_uri, http_key and server_key are read by both builds. A value in this file replaces the embedded one, and
# the file cannot blank an embedded value, but the builds differ in what they reject:
#   PC     the lookup falls back to the embedded value only for an empty value or a bare ${VAR} that is unset
#          (src/runtime/lifecycle/service_map.cpp, LookupFlatWithDefaults); it does not check whitespace or the scheme.
#   Quest  an empty value, whitespace or a control character, a wrong scheme or a missing host, a value over the
#          length cap, or a bare ${VAR} that is unset is rejected by key (logged without the value) and the embedded
#          value stays (src/quest/sentinel/quest_config.cpp, ValidateValue).
#
# Reader: src/runtime/lifecycle/service_map.cpp, src/runtime/server/gameserver_serverdb.cpp (AuthenticateServer),
#         src/runtime/compat/ws_bridge.cpp (PC); src/quest/sentinel/quest_config.cpp (Quest)
# ---------------------------------------------------------------------------

auth:
  # HTTP endpoint for REST API calls (Nakama device auth, account operations).
  # Used to rewrite hardcoded https://*.readyatdawn.com URLs and by
  # AuthenticateServer for the Nakama device-auth flow. Both builds; on the Quest it also turns the redirect on.
  # Should start with http:// or https:// and name a host; the Quest rejects a value that does not, the PC does not check.
  # Default (absent): the embedded value.
  # Not a secret.
  # http_uri: "https://api.echovrce.com"

  # HTTP API key. Sent as Bearer auth on REST calls when the game's internal
  # token cache is empty. Both builds.
  # Default (absent): the embedded public key.
  # SECRET — use env-var substitution in production.
  # http_key: "${NEVR_API_KEY:?http_key is required}"

  # Server authentication key. Used as the Basic-auth username when
  # authenticating a server with Nakama (POST /v2/account/authenticate/device).
  # Required for dedicated server operation. Both builds; on the Quest, login (and so the façade) is on only when
  # this resolves.
  # Default (absent): the embedded public key (client mode only; a dedicated server has none).
  # KNOWN-WRONG #1305: a dedicated server takes the embedded key too (#843).
  # SECRET — use env-var substitution in production.
  # server_key: "${NEVR_SOCKET_KEY:?server_key is required for servers}"

  # A dedicated server needs no username or password: it signs in by device code. At startup it prints a code and
  # the page that takes it on the console (standard error) and in the log, waits for the approval, asks for a new
  # code when one runs out, and keeps the token in the sign-in cache of the nevr root, so a restart needs no new code.

# ---------------------------------------------------------------------------
# guilds — guild filter for server registration
#
# Comma-separated list of guild IDs. When set, the server only registers
# with the specified guilds' ServerDB instances. Sent as a query parameter
# in the ServerDB WebSocket URI.
# Absent: no guild filter (server registers with all guilds).
# Not a secret.
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration)
# ---------------------------------------------------------------------------
# guilds: "guild-abc123,guild-def456"

# ---------------------------------------------------------------------------
# regions — region filter for server registration
#
# Comma-separated list of region codes (e.g. "us-west,us-east"). When set,
# the server only registers in the specified regions. Sent as a query
# parameter in the ServerDB WebSocket URI.
# Absent: no region filter.
# Not a secret.
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration)
# ---------------------------------------------------------------------------
# network:
#   regions: "us-west"

# ---------------------------------------------------------------------------
# telemetry — real-time game state streaming
#
# When enabled (via the "-telemetry" CLI flag, which is the default for
# servers), the server streams match telemetry over a dedicated WebSocket
# to a telemetry ingest server. Disable with "-no-telemetry".
#
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/server/gameserver_telemetry.cpp (telemetry streamer)
# ---------------------------------------------------------------------------

telemetry:
  # Telemetry ingest WebSocket URI. If set and CLI telemetry is enabled,
  # the server connects and streams match data.
  # Absent: telemetry is silently disabled even if the CLI flag is set.
  # Not a secret.
  # uri: "wss://telemetry.echovrce.com/ingest"

  # Bearer token sent on the telemetry WebSocket upgrade request.
  # If absent, the cached Nakama auth token is used as a fallback.
  # SECRET — use env-var substitution in production.
  # token: "${NEVR_TELEMETRY_TOKEN:-}"

# ---------------------------------------------------------------------------
# arena — Arena game mode rule overrides
#
# Override the Arena rule config that the game normally loads from its
# internal netconfig_dedicatedserver.json asset. Values are floats; 0 means
# "use the game default." All keys are optional.
#
# Reader: src/runtime/lifecycle/config.cpp (LoadLocalConfigHook, CJsonGetFloatHook)
# ---------------------------------------------------------------------------

arena:
  # Round time in seconds. Overrides the game's "round_time" config value.
  # Absent: game default (typically 180.0).
  # Not a secret.
  # round_time: 300.0

  # Post-score celebration time in seconds. Overrides the game's
  # "point_score_celebration_time" config value.
  # Absent: game default (typically 5.0).
  # Not a secret.
  # celebration_time: 10.0

  # Mercy-rule point spread. If one team leads by this many points, the
  # mercy rule triggers. Overrides the game's "mercy_win_point_spread" value.
  # Absent: game default.
  # Not a secret.
  # mercy_score: 15.0

# ---------------------------------------------------------------------------
# assets.whole_game — the manifest holds every asset of the game (Quest only)
#
# Needs assets.manifest. The first-run data step does not fetch the data zip
# and never ends the process for a missing _data (docs/adr/0045-cdn-texture-delivery.md, decision 11).
# Absent: false.
# Not a secret.
# Reader: src/quest/sentinel/quest_config.cpp
# ---------------------------------------------------------------------------
# assets:
#   whole_game: false

# ---------------------------------------------------------------------------
# exitonerror — exit the process on fatal errors
# KNOWN-WRONG #1279: the key does nothing.
#
# When true, the game process calls ExitProcess on fatal errors (e.g.
# ServerDB disconnection) rather than showing a crash dialog. This is the
# default behavior for dedicated servers. CLI flag "-no-exit-on-error" overrides
# to false; "-exit-on-error" has no effect (it's now the default).
# Absent: true (exit on error).
# Not a secret.
# Reader: src/runtime/lifecycle/config.cpp (LoadLocalConfigHook)
# ---------------------------------------------------------------------------
# exitonerror: true

# ---------------------------------------------------------------------------
# update — PC self-update (ADR 0024)
#
# Once per launch, after start-up, the runtime asks the signed manifest which release its channel names. When that is a
# different release it downloads it, checks every byte against the manifest and the release signer's Authenticode signature,
# and stages it under update\ in the nEVR root (%LOCALAPPDATA%\nevr\echovr). The host puts it in place at the next launch and
# loads it; a release that does not start is replaced by the one that did. Nothing is written to the game folder. The check
# runs on its own thread: the game never waits for it. A build made for development never updates.
#
#   enabled   false turns the check off (a release the host already swapped in is still confirmed). The "-no-update" flag
#             does the same for one run. Absent: true.
#   channel   The release channel to follow (for example "beta" or "stable"). Absent: the channel the installer recorded,
#             else the core's default. The "update check" log line names the channel and where it came from
#             (channel_source: config, state or default).
#
# Not secrets.
# Reader: src/runtime/lifecycle/service_config.cpp (NevrCfgUpdateEnabled, NevrCfgUpdateChannel),
#         src/runtime/lifecycle/update_worker.cpp
# ---------------------------------------------------------------------------
# update:
#   enabled: true
#   channel: beta

# ---------------------------------------------------------------------------
# plugins — plugin loading and configuration
#
# Plugins are optional DLLs loaded from plugins\ in the nEVR root
# (%LOCALAPPDATA%\nevr\echovr, ADR 0012), never from the game folder. Each plugin exports the NevrPluginInterface lifecycle:
#
#   NevrPluginGetInfo()      — returns name, version, description (REQUIRED)
#   NevrPluginGetApiVersion() — returns API version number (optional; v1 assumed)
#   NevrPluginInit(ctx)      — called once at load time (optional)
#   NevrPluginOnFrame(ctx)   — called each game frame (optional)
#   NevrPluginOnGameStateChange(ctx, old, new) — state transition hook (optional)
#   NevrPluginShutdown()     — called at unload time (optional)
#
# InitEx contract (NevrPluginInitEx, optional, API v4): a plugin that exports it
# is called with (ctx, args_json), where args_json is the entry's `args` as a
# flat JSON object string ("{}" when the entry has none, never null). The
# plugin extracts the keys it understands, ignores the rest, and uses sensible
# defaults for any key that is missing.
#
# On PC this list is the only source: a DLL in the root's plugins\ that is not listed here is not loaded.
#
# On Quest, a plugin packaged in the APK loads by default, with no entry here (the build writes
# libnevr_plugin_manifest.so beside the packaged plugins; ADR 0019). An entry here whose file is a packaged plugin's
# overrides that plugin's enabled, required, target and args in place, and an entry can set `early` but not clear it
# (a packaged plugin built early stays early). An entry whose file is not packaged is loaded from the library
# directory as the list says, and ends "failed" in the log when the file is not there. The load order is the packaged
# plugins in the order they were packaged, then the entries that name no packaged plugin, in list order.
# Each plugin entry has these keys:
#   name      — the plugin's name (required); also the default file name
#   file      — DLL file name inside the root's plugins\ (default: name + ".dll")
#   enabled   — if false, the plugin is not loaded (it is still reported at login)
#   required  — if true and the plugin fails to load or initialise, a dedicated
#               server stops with a fatal error; a client logs a warning and
#               continues
#   args      — plugin-specific arguments, flattened to dotted keys with string
#               values and passed as a flat JSON object to InitEx
#   target    — (optional) "server" | "client" | "both"; recorded with the entry
#               but not acted on: the loader loads the plugin on both
#   early     — if true, the plugin loads at the game's first command-line pass,
#               before the game reads its data (manifests, packages); the rest
#               load after the graphics device (client) or that pass (server).
#               For a plugin that must be in place before that read; it must
#               stay off the graphics path.
#               A repeat of an earlier entry for the same file is skipped as
#               usual, so the first entry decides the pass.
#
# All keys except "name" are optional. Absent enabled defaults to true.
# Absent required defaults to false.
# Absent args means the plugin gets an empty JSON object.
# Absent early means the plugin loads in the normal pass.
#
# Reported at login (#60): the client login JSON carries a top-level
# "nevr_plugins" array with one object per entry of this list, in list order:
#   name, file, enabled, required, loaded   always
#   error                                   enabled but not loaded (the reason the
#                                           loader logged; never the args)
#   ver ("M.m.p"), api, caps                loaded
# Args are never sent. Built by src/runtime/ext/plugin_manifest.cpp.
#
# Reader: src/runtime/ext/plugin_loader.cpp (entries parsed in src/core/nevr_config.cpp)
# ---------------------------------------------------------------------------

plugins:
  # Example 1: A plugin a dedicated server must not run without (required).
  # - name: combat_mod
  #   enabled: true
  #   required: true
  #   args:
  #     damage_multiplier: 1.5
  #     friendly_fire: false

  # Example 2: An optional plugin with no special config.
  # - name: audio_intercom
  #   enabled: true
