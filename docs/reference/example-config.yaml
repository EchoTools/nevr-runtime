# nEVR Runtime Configuration
#
# One file, one parser: nEVR's own config reader (src/core/nevr_config.cpp, yaml-cpp). It is not the game's JSON
# config; the game's JSON parser never sees this file.
#
#   PC     the file named by -config-file <file>, else %LOCALAPPDATA%\nevr\echovr\config.yaml (the nEVR root).
#          Nothing else is searched. A -config-file that names no readable file ends the run with exit code 64.
#          A config.yaml in <exe dir>\_local (or one or two folders up) is never read: when the root has none, the
#          first one found is copied there once and the old file is left as it is. Read by
#          src/runtime/lifecycle/service_config.cpp.
#   Quest  /sdcard/Android/data/com.readyatdawn.r15/files/config.yaml. Read by src/quest/sentinel/activation.cpp
#          and src/quest/sentinel/quest_config.cpp. A nevr-quest.json in that directory is not read; the sentinel
#          logs once that it is present and ignored.
#
# Both builds work with no file at all: the service endpoints and the public client keys are embedded at build
# time (config/public-defaults.env), and a key in this file replaces the embedded value. Each key below says which
# builds read it ("both", "PC only", "Quest only"), its default, and the file that reads it.
# KNOWN-WRONG #1254: a PC server with no file and no cached sign-in never logs in and never stops.
#
# The Quest reads exactly these keys: services.socket_uri, auth.http_uri, auth.http_key, auth.server_key,
# social.facade, social.send_presence_to_meta, diagnostics.hardware_dump, diagnostics.ui_event_probe,
# diagnostics.pnsrad_provider, diagnostics.clock_levels_override and graphics.texture_quality. Every other key below is PC only: the
# Quest accepts it (it is valid YAML under a known section) and reads nothing from it.
#
# A file the parser cannot use as a whole (a YAML error, an unknown top-level key, a top level that is not a
# mapping, a malformed plugins list, a ${VAR:?} that is unset, nesting deeper than 64 levels, or more than 100,000
# nodes once aliases are expanded) is rejected: the PC server exits (N4); the PC client and the Quest log it and
# run on the embedded defaults. The Quest also rejects a file over 64 KiB. Top-level keys are the sections below
# plus x-* extensions.
#
# Config keys are read by the nEVR runtime (`nevr-runtime.dll` on PC, the sentinel `libovrplatformloader.so` on Quest),
# which runs in-process with the game.
#
# Secrets (keys, tokens, passwords) MUST use ${VAR:?error} environment-variable
# substitution in production. The literal form is for local dev only and MUST
# NEVER be committed to version control.
#
# Every value is interpolated: ${VAR} (an unset one is logged
# once at load; its text is kept in plugin args and other values, and a service key that
# uses it counts as unset), ${VAR:?msg} (required: the load fails when it is
# unset), ${VAR:-default} (optional). Write $${ for a literal ${ that is not a
# variable, e.g. in a plugin's args; nothing after it is looked up. $${ is the
# only escape: $$ not followed by { stays $$. A literal $ immediately followed by
# a variable's value is written ${NO_SUCH_VAR:-$}${VAR}.
# ---------------------------------------------------------------------------

# Schema version. Bump when adding new required sections or restructuring
# existing ones. Currently always 1.
# Reader: src/runtime/lifecycle/config.cpp (LoadLocalConfigHook)
version: 1

# ---------------------------------------------------------------------------
# audio — the player's chosen devices (#412). Optional: absent means the default rule.
#
# Reader: src/runtime/lifecycle/service_config.cpp (NevrCfgCaptureDevice), used by
#         src/runtime/patch/mic_provider.cpp (PC, native Windows only; Wine keeps the OS default)
# ---------------------------------------------------------------------------

# KNOWN-WRONG #1305: the parser rejects a top-level audio: key, so this file as shipped is refused.
audio:
  # The microphone to capture from: an endpoint id, or a part of its friendly name (case-insensitive).
  # When it names no active capture endpoint, the default rule runs: LibOVR's headset mic, a headset-named
  # endpoint, then the OS default. Default (absent): that default rule.
  # capture_device: "Headset Microphone"

# ---------------------------------------------------------------------------
# social — platform social-provider compatibility
#
# pnsrad exports no Social object, so the game's friends and parties would be
# disabled. The façade stands in for it (friends from the server's friend list,
# parties over the server's party messages). It is on by default and only ever
# replaces a missing Social object.
#
# Reader: src/runtime/lifecycle/service_map.cpp (SocialFacadeEnabled, PC),
#         src/quest/sentinel/quest_config.cpp (Quest)
# ---------------------------------------------------------------------------

social:
  # Turn the façade off with `false`. Both builds.
  # Default (absent): true. On the Quest it also needs login: with no usable socket URI and server key the
  # façade is off whatever this says (the sentinel log names the missing prerequisite). The status names under
  # a friend's entry (the rich-presence destinations) ride with the façade and have no key of their own.
  # facade: false

  # Quest only (the PC reads nothing here). Send the rich presence to Meta's platform service, as the game does.
  # `false` answers it locally (no group_presence request leaves the headset, which fails for this APK's identity
  # anyway); friends' status then comes from the game service. Needs the façade.
  # Default (absent): true.
  # send_presence_to_meta: false

# ---------------------------------------------------------------------------
# diagnostics — build diagnostics
#
# Readers: src/quest/sentinel/quest_config.cpp (Quest: hardware_dump, ui_event_probe) and
# src/runtime/lifecycle/service_map.cpp, FrameStatsMode (PC: frame_stats). The PC reads nothing else from the
# section; the Quest reads nothing from frame_stats.
# ---------------------------------------------------------------------------

diagnostics:
  # PC only. The frame-time probe (src/runtime/frame/frame_stats.h): one `[NEVR.PERF] frame_stats` line every 10 s
  # with the interval between iterations of the game's main loop (frames, median_us, p95_us, max_us, over_1p5x,
  # overruns) and, in a PCVR session, the compositor's dropped-frame counts and the app's CPU and GPU time.
  #   true  the loop-interval ring and the line
  #   perf  the line with the compositor stats only (frames=0), to compare the game's own app CPU time with the
  #         ring off against the ring on
  #   false no line
  # The ovr_GetPerfStats copy is installed on every client whatever this says; it keeps what it reads only while
  # this is true or perf. The resolved value is logged at start-up (`[NEVR.PERF] frame_stats start`), off included.
  # tools/perf/pc_frame_summary.py turns one run's lines into summary.json.
  # Default (absent): false.
  # frame_stats: true

  # Quest only. Write the hardware/environment dump (docs/adr/0006-quest-hardware-dump.md) at start-up.
  # Default (absent): false.
  # hardware_dump: true

  # Quest only. The invite/party tab event: the party tab's Invite Members (and the own-id Party button) asks the
  # tablet to switch to its Friends list, where the "+" sends the invite. Needs social.facade.
  # Default (absent): true. Set false to turn the event off.
  # ui_event_probe: false

  # Quest only. Load the game's own libpnsrad as its platform provider instead of libpnsovr, as the PC does
  # (docs/adr/0026-quest-without-pnsovr.md). For development only: nothing sends the login on it yet (#1220), so the
  # game does not log in with it on. Needs the login.
  # Default (absent): false.
  # pnsrad_provider: true

  # Quest only. The clock-level override (#928): the game asks VrApi for CPU and GPU clock level 2/2 once per entry into VR
  # mode, and with this on the sentinel asks for 4/4 instead; any other pair the game asks for is passed through
  # unchanged. The render_config line reports the levels applied (cpu_level, gpu_level) and VrApi's answer
  # (clock_result); the resolved value is logged at start-up even when off. Needs no other feature.
  # Default (absent): false. Set true to turn the override on.
  # clock_levels_override: true

# ---------------------------------------------------------------------------
# graphics — render quality
#
# Reader: src/quest/sentinel/quest_config.cpp (Quest). The PC accepts the section and reads nothing from it.
# ---------------------------------------------------------------------------

graphics:
  # Quest only. The size of the eye buffer the game renders into (per eye). One of: stock, very_low, low, medium, high,
  # very_high, ultra (lower case, exactly). The sizes are the ones the community patch repository's Texture Resolution
  # setting uses for the same names, chosen by headset (a Quest 2 or a Quest 3, from the suggested width): Quest 3 very_low
  # 1344x1408, low 1680x1760, medium 2376x2568, high 3072x3380, very_high 3584x3944, ultra 4096x4506; Quest 2 very_low
  # 1152x1264, low 1440x1584, medium 1728x1904, high 2016x2224, very_high 2304x2528, ultra 2592x2848; 2 samples. This build
  # has not measured any headset's native size. A bigger size looks sharper and costs frame time. `low` answers the
  # headset's own size, and so does `stock`.
  # The game's settings menu has the same setting: a GRAPHICS page with one control, "Texture Resolution", of the six
  # levels (Very Low to Ultra). A change there applies at the next frame, with no restart, and the game saves it. This key
  # is the level the game starts at when the player has chosen nothing; what the player saved always wins over it. The
  # control shows `stock` as Low.
  # Read once at launch. Any mistake (a value that is not one of the seven words, a mapping or a list, a key with no value,
  # a `graphics` that is not a mapping, an unset ${VAR}, a file rejected as a whole) gives `stock`, with a warning in the
  # sentinel log that names the key. Any other key under `graphics` (a misspelling such as `texture_qualty`, or
  # `Texture_Quality`) is ignored with a warning that names it.
  # Default (absent): stock. The log line `texture_quality` in the sentinel log names the level, its source and the size.
  # texture_quality: high

# ---------------------------------------------------------------------------
# services — URL overrides for game service endpoints
#
# The game hardcodes *.readyatdawn.com URLs that no longer resolve. These keys
# let you redirect each service to nEVR's community infrastructure. Every key
# is optional; when absent the game's hardcoded default is used (and the
# connection will fail unless the WebSocket bridge is active).
#
# Fallback chain (per-key, in GetServiceHostWithFallback):
#   1. Specific service key (e.g. services.config)
#   2. services.login (shared fallback)
#   3. Game hardcoded default
#
# Reader: src/runtime/lifecycle/config.cpp (HttpConnectHook, GetServiceHostWithFallback)
# ---------------------------------------------------------------------------

services:
  # WebSocket endpoint for all game services (login, matchmaking, config, serverdb). Both builds. The runtime
  # rewrites the game's hardcoded wss://*.readyatdawn.com URLs to it; the in-process WebSocket bridge connects to it
  # outbound, and the game's own connections go through the bridge (ws://127.0.0.1:<port>).
  # Default (absent): the value embedded in the build (config/public-defaults.env), on a client and a dedicated
  # server alike (#843). An explicit empty value (`socket_uri: ""`) on a dedicated server takes no default: the
  # server then exits without it unless allow_offline_server is set. The log line `[NEVR.CONFIG] built-in defaults
  # in use` names the keys taken from the build.
  # On the Quest this one key (or auth.http_uri) is what turns the redirect on, and with it the bridge: there is no
  # key for either. Login then needs auth.server_key.
  # Not a secret.
  # Reader: src/runtime/lifecycle/service_map.cpp (flat key nevr_socket_uri), src/quest/sentinel/quest_config.cpp
  # socket_uri: "wss://g.echovrce.com/ws"

  # Dedicated server only: boot without services.socket_uri (no login bridge). Without this a server
  # that has no socket_uri after the built-in default (set socket_uri: "" to take none) exits at start-up,
  # because it could never log in. Set it only for offline boots (test rigs); such a server never logs in or registers.
  # Default (absent): false
  # allow_offline_server: true

  # Login / authentication service. Also serves as the shared fallback for
  # every other service key that is not explicitly set.
  # Default (absent): https://login.readyatdawn.com
  # Not a secret.
  # login: "https://login.echovrce.com"

  # Config / settings service (game config, feature flags, etc.).
  # Fallback: services.login
  # Default (absent): https://config.readyatdawn.com
  # Not a secret.
  # config: "https://config.echovrce.com"

  # General API service (REST endpoints for account, inventory, etc.).
  # Legacy key "api_host" is also checked if apiservice_host is absent.
  # Fallback: services.login
  # Default (absent): https://api.readyatdawn.com
  # Not a secret.
  # api: "https://api.echovrce.com"

  # Transaction / IAP service.
  # Fallback: services.login
  # Default (absent): https://transaction.readyatdawn.com
  # Not a secret.
  # transaction: "https://transaction.echovrce.com"

  # Matchmaking service (lobby creation, server discovery).
  # When the WebSocket bridge is active and no explicit override is set,
  # this service is auto-relayed through the bridge's local proxy.
  # Fallback: services.login
  # Default (absent): wss://matchmaking.readyatdawn.com
  # Not a secret.
  # matchmaking: "wss://matchmaking.echovrce.com"

  # ServerDB / registry service (game server registration and heartbeat).
  # Auto-relayed through the WebSocket bridge when active.
  # Fallback: services.login
  # Default (absent): wss://serverdb.readyatdawn.com
  # Not a secret.
  # serverdb: "wss://serverdb.echovrce.com"

  # Dedicated server only: the ServerDB token route the server registers through, dialed with the server's
  # access token as `Authorization: Bearer` (docs/adr/0001-serverdb-token-auth.md); guilds and regions are added
  # as query parameters. Without it a server with auth.password registers through socket_uri with
  # identity.discord_id and auth.password in the query; a server with no auth.password (it signed in by device
  # code) registers on the token route at socket_uri, so it needs no configuration. A server with none of
  # serverdb, serverdb_uri, or socket_uri plus identity.discord_id stops at registration:
  # `no ServerDB URI: set services.serverdb_uri`.
  # The route taken is logged: `[NEVR.GAMESERVER] serverdb route=<explicit|token|url_params|none> ...`.
  # Default (absent): socket_uri for a server with no auth.password; none for a server with one.
  # Not a secret.
  # Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration, flat key nevr_serverdb_uri)
  # serverdb_uri: "ws://g.echovrce.com:80/nevr"

  # Oculus Graph API. Only relevant if the game still queries Oculus services.
  # Legacy key "graphservice_host" is also checked.
  # Default (absent): https://graph.oculus.com
  # Not a secret.
  # graph: "https://graph.oculus.com"

# ---------------------------------------------------------------------------
# network — IP and port configuration for server hosting
#
# Controls how the game server advertises itself to ServerDB and which
# IP addresses it uses for peer-to-peer connections. All keys are optional.
#
# Reader: src/runtime/lifecycle/config.cpp (external_ip, upnp, upnp_port),
#         src/runtime/server/gameserver.cpp (ReadUPnPConfig),
#         src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/server/gameserver_callbacks.cpp (re-registration)
# ---------------------------------------------------------------------------

network:
  # empty_server_ttl_seconds: 0   # 0 (default) = off. Seconds an empty server holds its return to
  #                               # lobby before the process exits; docs/reference/empty-server-ttl.md
  # Internal IP address to advertise for LAN / same-host connections.
  # Use when the auto-detected IP is wrong (multi-homed hosts, Docker, VPNs).
  # Absent: auto-detected from the first non-loopback interface.
  # Not a secret.
  # internal_ip: "192.168.1.100"

  # External / public IP address to advertise to ServerDB.
  # Use when the server is behind NAT and auto-detection picks the wrong IP.
  # Absent: auto-detected via UPnP WAN IP (if UPnP is enabled) or falls back
  # to internal_ip.
  # Not a secret.
  # external_ip: "203.0.113.5"

  # Enable UPnP IGD port mapping for the broadcaster UDP port.
  # When true, the runtime probes for a UPnP IGD and attempts to map the port.
  # CLI flag "-upnp" overrides this value to true.
  # Absent: false (no UPnP).
  # Not a secret.
  # upnp: true

  # External port to request from UPnP. Only used when upnp is enabled.
  # If absent or 0, the internal broadcaster port is used as the external port.
  # Valid range: 1-65535.
  # Absent: 0 (use internal port).
  # Not a secret.
  # upnp_port: 7777

  # A dedicated server's tick rate in Hz: the fixed time step is 1,000,000 / rate microseconds.
  # Valid: 10-1000, or 0 to keep the game's own fixed step (30 a second). A server is always
  # fixed-timestep; 0 does not unpace the loop. Out of range or not a whole number: the default, with
  # a warning in the log. Ignored by a client.
  # Absent: 120.
  # Not a secret.
  # tick_rate_hz: 120

  # AI bots a dedicated server adds to each arena or combat match once it is in game (a social lobby gets none), one a
  # second, through the game's own add-bot request (what the spawn-bot script node uses), so every client sees them.
  # The match's settings get numteams and players_per_team when the service did not send them. A level stops taking
  # bots when its bot bodies run out (a warning says so), and a match never passes the game's 16 entrants. Valid:
  # 0-16. Out of range or not a whole number: 0, with a warning in the log. Ignored by a client.
  # Absent: 0 (no bots).
  # Not a secret.
  # bots_per_session: 0
  # A dedicated server's match team size: how many players the game's own team assignment puts on one team before
  # it moves the next to the other team or to spectators. A team holds the smaller of this and half its lobby's
  # player limit, in every mode but the AI and social modes (the AI modes keep the game's 3). Valid: 1-8. 1 to 4
  # lowers every match's teams, public matches included; above 5 only a lobby whose limit is 12 or more gets bigger
  # teams (which lobbies the service sends with such a limit is not measured here), and a member past a team's fifth
  # takes a team slot from the start again (a sixth member takes the first slot). Not measured here: EchoRelay reports
  # that an 11th player in a match stops the server in an arena level; keep such a match at 10 players in all (6v4, for
  # example).
  # Out of range or not a whole number: 5, with a warning in the log. Ignored by a client.
  # Absent: 5 (the game's own).
  # Not a secret.
  # max_team_size: 5

  # Which game sockets the PC bridge hands to the session router (the rules the Quest build ships).
  # legacy: the bridge's own rules for every socket. config: the /config sockets route through the router;
  # login and matchmaker sockets keep the bridge's rules. all: every game socket (config, login and matchmaker)
  # routes through the router. Any other value is refused at boot with a fatal error naming the key; the bridge
  # never guesses a mode from a misspelling.
  # Absent: legacy.
  # Not a secret.
  # session_router: legacy

  # The invite codes for the CREATE GAME / JOIN VIA CODE wizard: when on, a code typed into JOIN VIA CODE, and a create,
  # is sent to the game service (auth.http_uri, with the token this client already holds).
  # Absent or empty: on. true/on/yes/1 is on; false/off/no/0 turns it off. Any other value, a list or a map included, leaves
  # it off, with a warning in the log. A key the runtime does not read (a misspelling, or a config.yaml it rejects) is as if
  # absent: on. Ignored by a dedicated server.
  # Absent: on.
  # Not a secret.
  # invite_codes: false

# ---------------------------------------------------------------------------
# identity — server identity fields sent during ServerDB registration
#
# These identify the server instance to the community infrastructure.
# All keys are optional but a server without them will fail to register.
#
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/compat/ws_bridge.cpp
# ---------------------------------------------------------------------------

identity:
  # Discord user ID of the server owner. Sent as a query parameter in the
  # ServerDB WebSocket URI. Required for server registration.
  # Absent: the server registers through services.serverdb_uri, and with neither it stops at registration.
  # Not a secret, but personally identifying — do not commit to public repos.
  # discord_id: "${NEVR_DISCORD_ID:?discord_id is required for server registration}"

# ---------------------------------------------------------------------------
# auth — authentication and API endpoint configuration
#
# Used for server authentication with Nakama (device-auth flow) and for HTTP
# API calls. The socket URI the in-process WebSocket bridge connects to is
# services.socket_uri, above.
#
# http_uri, http_key and server_key are read by both builds. A value in this file replaces the embedded one, and
# the file cannot blank an embedded value, but the builds differ in what they reject:
#   PC     the lookup falls back to the embedded value only for an empty value or a bare ${VAR} that is unset
#          (src/runtime/lifecycle/service_map.cpp, LookupFlatWithDefaults); it does not check whitespace or the scheme.
#   Quest  an empty value, whitespace or a control character, a wrong scheme or a missing host, a value over the
#          length cap, or a bare ${VAR} that is unset is rejected by key (logged without the value) and the embedded
#          value stays (src/quest/sentinel/quest_config.cpp, ValidateValue).
#
# Reader: src/runtime/lifecycle/service_map.cpp, src/runtime/server/gameserver_serverdb.cpp (AuthenticateServer),
#         src/runtime/compat/ws_bridge.cpp (PC); src/quest/sentinel/quest_config.cpp (Quest)
# ---------------------------------------------------------------------------

auth:
  # HTTP endpoint for REST API calls (Nakama device auth, account operations).
  # Used to rewrite hardcoded https://*.readyatdawn.com URLs and by
  # AuthenticateServer for the Nakama device-auth flow. Both builds; on the Quest it also turns the redirect on.
  # Should start with http:// or https:// and name a host; the Quest rejects a value that does not, the PC does not check.
  # Default (absent): the embedded value.
  # Not a secret.
  # http_uri: "https://api.echovrce.com"

  # HTTP API key. Sent as Bearer auth on REST calls when the game's internal
  # token cache is empty. Both builds.
  # Default (absent): the embedded public key.
  # SECRET — use env-var substitution in production.
  # http_key: "${NEVR_API_KEY:?http_key is required}"

  # Server authentication key. Used as the Basic-auth username when
  # authenticating a server with Nakama (POST /v2/account/authenticate/device).
  # Required for dedicated server operation. Both builds; on the Quest, login (and so the façade) is on only when
  # this resolves.
  # Default (absent): the embedded public key (client mode only; a dedicated server has none).
  # KNOWN-WRONG #1305: a dedicated server takes the embedded key too (#843).
  # SECRET — use env-var substitution in production.
  # server_key: "${NEVR_SOCKET_KEY:?server_key is required for servers}"

  # Server password. Sent as a query parameter in the ServerDB WebSocket URI (the key the runtime reads is auth.password).
  # Optional; absent means the server signs in by device code like a client: at startup it prints a code and the
  # page that takes it on the console (standard error), waits for the approval, asks for a new code when one runs
  # out, and keeps the token in the sign-in cache of the nevr root, so a restart needs no new code.
  # SECRET — use env-var substitution in production.
  # password: "${NEVR_PASSWORD:?password is required}"

# ---------------------------------------------------------------------------
# guilds — guild filter for server registration
#
# Comma-separated list of guild IDs. When set, the server only registers
# with the specified guilds' ServerDB instances. Sent as a query parameter
# in the ServerDB WebSocket URI.
# Absent: no guild filter (server registers with all guilds).
# Not a secret.
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration)
# ---------------------------------------------------------------------------
# guilds: "guild-abc123,guild-def456"

# ---------------------------------------------------------------------------
# regions — region filter for server registration
#
# Comma-separated list of region codes (e.g. "us-west,us-east"). When set,
# the server only registers in the specified regions. Sent as a query
# parameter in the ServerDB WebSocket URI.
# Absent: no region filter.
# Not a secret.
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration)
# ---------------------------------------------------------------------------
# network:
#   regions: "us-west"

# ---------------------------------------------------------------------------
# telemetry — real-time game state streaming
#
# When enabled (via the "-telemetry" CLI flag, which is the default for
# servers), the server streams match telemetry over a dedicated WebSocket
# to a telemetry ingest server. Disable with "-no-telemetry".
#
# Reader: src/runtime/server/gameserver_serverdb.cpp (RequestRegistration),
#         src/runtime/server/gameserver_telemetry.cpp (telemetry streamer)
# ---------------------------------------------------------------------------

telemetry:
  # Telemetry ingest WebSocket URI. If set and CLI telemetry is enabled,
  # the server connects and streams match data.
  # Absent: telemetry is silently disabled even if the CLI flag is set.
  # Not a secret.
  # uri: "wss://telemetry.echovrce.com/ingest"

  # Bearer token sent on the telemetry WebSocket upgrade request.
  # If absent, the cached Nakama auth token is used as a fallback.
  # SECRET — use env-var substitution in production.
  # token: "${NEVR_TELEMETRY_TOKEN:-}"

# ---------------------------------------------------------------------------
# arena — Arena game mode rule overrides
#
# Override the Arena rule config that the game normally loads from its
# internal netconfig_dedicatedserver.json asset. Values are floats; 0 means
# "use the game default." All keys are optional.
#
# Reader: src/runtime/lifecycle/config.cpp (LoadLocalConfigHook, CJsonGetFloatHook)
# ---------------------------------------------------------------------------

arena:
  # Round time in seconds. Overrides the game's "round_time" config value.
  # Absent: game default (typically 180.0), except on a server, where a public Arena
  # session uses 480.0 (8:00). The session's game type is stored from the session
  # create and from the session start frame the game starts from, so the order the
  # service sends them in does not matter. Other game types, private Arena and reads
  # before any session keep the game default (#982).
  # Not a secret.
  # round_time: 300.0

  # Post-score celebration time in seconds. Overrides the game's
  # "point_score_celebration_time" config value.
  # Absent: game default (typically 5.0).
  # Not a secret.
  # celebration_time: 10.0

  # Mercy-rule point spread. If one team leads by this many points, the
  # mercy rule triggers. Overrides the game's "mercy_win_point_spread" value.
  # Absent: game default.
  # Not a secret.
  # mercy_score: 15.0

# ---------------------------------------------------------------------------
# asset_cdn_url — custom CDN for game asset downloads
#
# Override the base URL the game uses to download asset bundles (cosmetics,
# arena geometry, etc.). When set, the runtime hooks the asset download
# pipeline and redirects requests to this URL.
# KNOWN-WRONG #1305: the runtime reads this key and discards it; the parser's path for it is assets.cdn_url.
# Absent: game downloads from the hardcoded Ready At Dawn CDN (dead).
# Not a secret.
