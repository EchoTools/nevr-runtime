# Request another player's profile (R15NetRequestProfileNode, run 0x140de01f0). Test plan #28.
# The node parses the user id and posts 0x1401a1930, which asks the profile manager; on a cache miss
# it logs "[PROFILE] Getting other user %s's profile" and sends SNSOtherUserProfileRequest; the
# reply raises the delegate that logs "[NETGAME] Profile received for '%s'" (0x14019f510). The user
# is the first friend in the roster, or, on an account with no confirmed friends (its friend list
# response carries none), the first person in the recently-met list: a real player either way, and
# reading their profile is what the game does when their page is opened. Until cd62b75 every reply
# after the lobby join went to a closed game connection and none arrived (runs
# 20261001T202330-suite/request_profile, 20261001T205315).
# Pass = the request (or a cache hit) and the received line for that player.
name: request_profile
description: fire the request-profile node for another player; see the request go out and the profile come back
steps:
  - name: client is in the social lobby (level loaded, in game)
    wait_log: {pattern: 'NetGame switching state \(from ready for game, to in game\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 5}
  # The roster and the recently-met list arrive after the lobby loads; ask for the second through
  # the game's node and wait for a non-empty answer, or the fire has no other player to name.
  - name: refresh the recently-met list through the game's node
    fire: {action: refresh_recently_met}
  - name: the server's list has people in it
    wait_log: {pattern: '\[NEVR\.SOCIAL\] recently met list count=[1-9]\d*', timeout: 20}
  - name: request that player's profile
    fire: {action: request_profile, user: other}
    save: {other_user: user}
  - name: the game asked for that player's profile (or had it cached)
    expect_log: {pattern: "\\[PROFILE\\] Getting other user ${other_user}'s profile|Profile received for '${other_user}'", timeout: 10}
  - name: that player's profile arrived
    expect_log: {pattern: "\\[NETGAME\\] Profile received for '${other_user}'", timeout: 30}
    diagnose: ['\\[PROFILE\\]', 'OtherUserProfile']
