  - name: "code 2: the game raised onpartyjoinerrorlocked"
    expect_log: {pattern: 'session event #\d+ id=0x[0-9a-f]+ delegate_onpartyjoinerrorlocked\b', timeout: 10}
    diagnose: ['party callback index=2 ', 'Party join failed']
  - name: "code 2: back in a party of its own"
    state_until: {party_joinable: true, timeout: 60}
  - name: "code 3: an invite arrives"
    inject: {msg: PartyInviteNotify, party: 777000000000013, inviter: '${inviter_id}'}
  - name: "code 3: the invite is listed"
