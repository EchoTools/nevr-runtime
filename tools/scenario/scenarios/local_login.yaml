# The local-nakama path itself (`server: local`): the client logs in to the nakama built from the
# social feature branch (`just nakama-dev-up && just nakama-seed`) as the seeded test account, and the
# party the game asks for after login is made by that server. There are no game servers locally, so
# no social lobby: local scenarios start from "logged in".
name: local_login
server: local
description: log in to the local nakama and get a party from it
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
    diagnose: ['LOGIN', 'Login', 'NEVR.WS']
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: the local server made the game's party
    state_until: {party_joinable: true, timeout: 60}
