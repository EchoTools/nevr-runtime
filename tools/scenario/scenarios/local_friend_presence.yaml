# A friend's presence end to end on the local nakama (proposal §1). Peers 1 and 2 are this client's
# friends and online, each leading a party; peer 2's party is invite only. On the client's friends
# refresh (R15NetRefreshFriendsNode's handler 0x14019ae10 -> slot 45) nakama sends each friend's
# SNSFriendPresenceNotify, derived on the server: no match is "In Main Menu"; peer 1's party is
# joinable for this client, peer 2's is not (not invited), so its id is withheld.
name: local_friend_presence
server: local
peers: 2
friends: [[client, 1], [client, 2]]
description: two online friends with parties; see each friend's presence text and only the joinable party
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: peer 1 online with an open party
    peer: {id: 1, do: create_party, save: {p1_party: party}}
  - name: peer 2 online with a party
    peer: {id: 2, do: create_party, save: {p2_party: party}}
  - name: peer 2's party is invite only
    peer: {id: 2, do: set_policy, arg: 0}
  - name: the client refreshes its friends (the game's own handler)
    fire: {action: refresh_friends}
  - name: nakama sent the friends' presence
    nakama_log: {pattern: '"msg":"Friend presence sent".*"friends":2', timeout: 15}
  - name: peer 1 is in the main menu with a joinable party
    state_until: {friend: {id: 900000000000000101, online: true, text: In Main Menu, party: '${p1_party}'}, timeout: 15}
  - name: peer 2 is in the main menu, its invite-only party not offered
    state_until: {friend: {id: 900000000000000102, online: true, text: In Main Menu, party: 0}, timeout: 15}
