# A failed accept stays where it was, end to end on the local nakama (owner, 2026-10-01: "if somebody
# accepts an invite, and they can't join the party then they stay where they are"). The invite is one
# the server never sent, so nakama answers the accept with PartyJoinFailure code 1 ("No pending invites
# for user", f2f91ea30) and, with the leave-only-after-joining change, does not take the player
# out of the party they lead. Pass = the server's refusal arrives, the game shows "not found", and the
# game is still in the same party.
name: local_accept_failure
server: local
description: accept an invite the server never sent; see the refusal and the game stay in its party
vars:
  party_id: 777000000000041
  inviter_id: 1000000000000000011
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: the game's own party
    state_until: {party_joinable: true, timeout: 60, save: {party_before: party.id}}
  - name: an invite arrives (injected; the server has no record of it)
    inject: {msg: PartyInviteNotify, party: '${party_id}', inviter: '${inviter_id}'}
  - name: the invite is listed
    state_until: {invite_count: 1, timeout: 15}
  - name: accept
    fire: {action: respond_to_invite, index: 0, accept: true}
  - name: the accept left the game
    expect_log: {pattern: 'game->server conn=\d+ PartyInviteResponse payload_bytes=\d+ param=1', timeout: 10}
  - name: the local nakama had no such invite
    nakama_log: {pattern: '"msg":"No (pending invites for user|matching invite found)"', timeout: 15}
  - name: the server's refusal arrived
    expect_log: {pattern: 'server->game conn=\d+ PartyJoinFailure payload_bytes=9', timeout: 15}
  - name: the game showed not found (outside a lobby PartyJoinFailedCB 0x140189590 words it "Game boot invite failed")
    expect_log: {pattern: '\[NETGAME\] (Party join|Game boot invite) failed: not found', timeout: 10}
  - name: still in the same party
    state_until: {path: party.id, equals: '${party_before}', timeout: 15}
