# Party and member shared data, the game's writes. docs/design/2026-10-01-social-features-test-plan.md #19.
# R15NetSetPartyMemberStringNode posts 0x1401b07e0(netGame, key, value): it asks slot 30
# MemberDataWritable for the local member's JSON root and writes the key. R15NetSetPartyStringNode
# posts 0x1401b0940: for the host (slot 24 IsHost) it marks the party data dirty and writes the party
# JSON. pnsovr then shared both with the room (slots 6/7 from its Update, 0x1800ac240); Nakama's
# PartyUpdate*Request carries no data (evr/sns_party.go), so sharing is not tested here: see #19.
# Pass = the member write reached slot 30 and the party write marked the party data written.
name: party_data
description: write a member string and a party string through the game's own nodes; see them reach the facade
steps:
  - name: client is in the social lobby (level loaded, in game)
    wait_log: {pattern: 'NetGame switching state \(from ready for game, to in game\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 5}
  - name: the game has its own party
    state_until: {party_joinable: true, timeout: 60}
  - name: write a member string
    fire: {action: set_party_member_string, key: scenariokey, value: scenariovalue}
  - name: slot 30 MemberDataWritable gave the local member's data
    expect_log: {pattern: 'slot=30 name=MemberDataWritable call=\d+ args=\S+,0,', timeout: 10}
  - name: write a party string
    fire: {action: set_party_string, key: scenariokey, value: scenariovalue}
  - name: the game marked the party data written (flags bit 0, set by 0x14015fdb0 for the host)
    state_until: {path: party.share_dirty, equals: true, timeout: 10}
  - name: the game is still running its frames
    state_until: {party_joinable: true, timeout: 10}
