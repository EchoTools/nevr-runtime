# Join policy end to end on the local nakama (proposal §4, docs/design/2026-10-01-social-nakama-proposal.md).
# The game's R15NetPartySetJoinPolicyNode (0x140dde110 -> 0x14018ab90 -> slot 16) sets the policy; the
# facade sends SNSPartySetJoinPolicyRequest for the party this client leads, and nakama stores it
# ("Party join policy set", evr_pipeline_party_policy.go) and enforces it on joins (a refusal is
# PartyJoinFailure code 3, the game's "no permission"; the rule is unit-tested in nakama). A second
# account's refused join needs a second client: see the in-game test plan.
name: local_party_policy
server: local
description: set the party's join policy through the game's node; see the request leave and the local nakama store it
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: the local server made the game's party, led by this client
    state_until: {party_joinable: true, timeout: 60}
  - name: invite only
    fire: {action: set_join_policy, policy: 0}
  - name: the policy request left the game
    expect_log: {pattern: 'game->server conn=\d+ PartySetJoinPolicyRequest', timeout: 10}
  - name: the local nakama stored invite only
    nakama_log: {pattern: '"msg":"Party join policy set".*"policy":0', timeout: 15}
  - name: everyone again
    fire: {action: set_join_policy, policy: 3}
  - name: the local nakama stored everyone
    nakama_log: {pattern: '"msg":"Party join policy set".*"policy":3', timeout: 15}
  - name: the game reports it
    state_until: {path: party.join_policy, equals: 3, timeout: 10}
