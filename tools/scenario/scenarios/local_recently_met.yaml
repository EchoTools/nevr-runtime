# Recently met end to end on the local nakama (proposal §2). Nakama writes a player's list when they
# leave a match (server/evr_recently_met.go, unit-tested: overlap, moderators, dedupe, cap, blocks);
# the local stack has no game server, so the list is seeded in the same storage object. Peer 1 is on
# it and online, peer 2 is on it and offline. The game's refresh node asks; nakama answers with
# names, status and, for peer 1, the presence text it derives (§1).
name: local_recently_met
server: local
peers: 2
met: [[client, 2], [client, 1]]
description: refresh the recently-met list against the local nakama; see the online peer first with its presence, the offline one after
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: the client's own party
    state_until: {party_joinable: true, timeout: 60}
  - name: peer 1 is online
    peer: {id: 1, do: login}
  - name: refresh through the game's node
    fire: {action: refresh_recently_met}
  - name: nakama answered with both, one online
    nakama_log: {pattern: '"msg":"Recently met list sent".*"count":2,"online":1', timeout: 15}
  - name: the bridge read it
    expect_log: {pattern: '\[NEVR\.SOCIAL\] recently met list count=2 online=1', timeout: 15}
  - name: the refresh ended
    state_until: {path: recently_met.refreshing, equals: false, timeout: 10}
  - name: peer 1 first
    state_until: {path: recently_met.users.0.id, equals: 900000000000000101, timeout: 5}
  - name: by name
    state_until: {path: recently_met.users.0.name, equals: localpeer1, timeout: 5}
  - name: online
    state_until: {path: recently_met.users.0.status, equals: 2, timeout: 5}
  - name: in the main menu, as the server derives it
    state_until: {path: recently_met.users.0.text, equals: In Main Menu, timeout: 5}
  - name: peer 2 after, offline
    state_until: {path: recently_met.users.1.id, equals: 900000000000000102, timeout: 5}
  - name: shown offline with no text
    state_until: {path: recently_met.users.1.status, equals: 0, timeout: 5}
