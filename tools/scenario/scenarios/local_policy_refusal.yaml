# A join refused by the party's policy, end to end on the local nakama (§4). A peer account leads a
# party set to invite only; this client is not invited and joins it by id (R15NetPartyJoinNode ->
# slot 2). nakama refuses with PartyJoinFailure code 3, the game's "no permission"
# (PartyJoinFailedCB 0x140189590), and the client stays in the party it was in.
name: local_policy_refusal
server: local
peers: 1
description: join a peer's invite-only party by id; see code 3 and the client stay in its party
steps:
  - name: logged in to the local nakama
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 30}
  - name: the client's own party
    state_until: {party_joinable: true, timeout: 60, save: {party_before: party.id}}
  - name: peer 1 makes a party
    peer: {id: 1, do: create_party, save: {peer_party: party}}
  - name: peer 1 sets it to invite only
    peer: {id: 1, do: set_policy, arg: 0}
  - name: the client joins it by id
    fire: {action: party_join, party: '${peer_party}'}
  - name: the join request left the game
    expect_log: {pattern: 'game->server conn=\d+ PartyJoinRequest', timeout: 10}
  - name: nakama refused it by policy
    nakama_log: {pattern: '"msg":"Party join refused by policy".*"policy":0', timeout: 15}
  - name: the game got JoinFailed with no permission (code 3)
    expect_log: {pattern: 'party callback index=2 arg=3 bound=1', timeout: 15}
  - name: still in the same party
    state_until: {path: party.id, equals: '${party_before}', timeout: 15}
