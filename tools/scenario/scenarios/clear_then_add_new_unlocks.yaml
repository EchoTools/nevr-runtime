# Hypothesis H (unlocks lead): the clear empties the profile key but not the in-memory array at netGame+0x51c20, so the
# next AddNewUnlocks (echovr.exe 0x140152c30) rebuilds the whole list. Sequence: (a) the count N the client loaded at
# login is read by the clear's own log line, (b) the clear, (c) ONE add. H holds if the array count after (c) is N+1,
# refuted if it is 1. The account must hold N > 0 stored entries (a clear_new_unlocks run left it at 0; an
# add_new_unlocks run puts entries back). The numbers are read from the console log by hand and written into the report
# (prediction: scratch 2026-11-12-unlocks-lead/H-PREDICTION.md). The item is an id the spritz account held before the
# first clear and is not one the account holds after the earlier populate run (0x87d5d9ecb92bdbee).
name: clear_then_add_new_unlocks
description: clear all new unlocks, then add one item, and see how many entries the array and the sent update hold
steps:
  - name: client is logged in (the clear needs the NetGame and the loaded profile, not a lobby)
    wait_log: {pattern: 'NetGame switching state \(from logging in, to logged in\)'}
  - name: control endpoint is up
    wait_log: {pattern: '\[NEVR\.SCENARIO\] control listening on 127\.0\.0\.1:\d+', timeout: 5}
  - name: (b) clear all new unlocks
    fire: {action: clear_new_unlocks}
  - name: (b) the clear ran, count_before is N
    expect_log: {pattern: '\[NEVR\.SCENARIO\] clear_new_unlocks count_before=[1-9]\d* count_after=0 user=present dirty_flags_before=0x[0-9a-f]+ dirty_flags_after=0x[0-9a-f]+', timeout: 10}
  - name: (c) add one item
    fire: {action: add_new_unlocks, item: '0x87d5d9ecb92bdbee'}
  - name: (c) the add ran
    expect_log: {pattern: '\[NEVR\.SCENARIO\] add_new_unlocks item=0x87d5d9ecb92bdbee count_before=\d+ count_after=\d+', timeout: 10}
  - name: (c) the game sent the update after the add
    expect_log: {pattern: '\[NSUSER\] sent profile update: .*newunlocks', timeout: 30}
