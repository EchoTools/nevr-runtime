# Shared compiler cache for every nevr-runtime worktree (the justfile points CCACHE_CONFIGPATH here).
# The cache directory and base_dir come from the justfile (CCACHE_DIR, CCACHE_BASEDIR): both depend on the machine.
max_size = 10G
# The build directory differs per worktree and is not part of any object's content.
hash_dir = false
# CMake precompiled headers (src/core/pch.h): the .gch is regenerated in every build tree.
sloppiness = pch_defines,time_macros
compression = true
